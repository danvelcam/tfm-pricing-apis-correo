# Datasheet ACM2YAML v0.3 — Mailchimp Transactional (Mandrill)
# Semáforo: 🟢 explícito en fuente oficial · 🟡 inferido · 🔴 no documentado

associated_saas: mailchimp-transactional                    # 🟢
type: api_first                                             # 🟢
url: https://mailchimp.com/pricing/transactional-email/     # 🟢
syntax_version: 0.3
date: 2026-09-21
currency: USD                                               # 🟢
consumption_units:
  - emails
  - requests
  - MBs

capacity:
  quota_email_block:
    value: 25000                                            # 🟢
    unit: emails
    period:
      value: 1
      unit: MONTH
    window_type: fixed_billing_cycle                        # 🟡

  quota_email_demo:
    value: 500                                              # 🟢
    unit: emails
    # 🔴 franquicia sin ventana declarada: el proveedor dice que no caduca ni se renueva, y v0.3 no tiene forma para eso (ver metadata.not_found)
    period:
    window_type:

max_power:
  rate_email_hourly_demo:
    value: 25                                               # 🟢
    unit: emails
    period:
      value: 1
      unit: HOUR

  rate_request_search:
    value: 20                                               # 🟢
    unit: requests
    period:
      value: 1
      unit: MIN

plans:
  transactional_email:
    price: 20.00                                            # 🟡
    period:
      value: 1
      unit: MONTH
    quota: quota_email_block
    endpoints:
      /messages/send:
        demo:
          rate: rate_email_hourly_demo
          quota: quota_email_demo
        workload:
          - unit: emails
            min: 1
            max:                                            # 🔴
            description: Envío a los destinatarios del array to; sin tope publicado, y 5.000 en una sola llamada se aceptaron al medirlo.
          - unit: MBs
            min: 1
            max: 10                                         # 🟢
            description: Tamaño del JSON de cada llamada a la API, adjuntos incluidos ya codificados.
      /messages/send-template:
        demo:
          rate: rate_email_hourly_demo
          quota: quota_email_demo
        workload:
          - unit: emails
            min: 1
            max:                                            # 🔴
            description: Envío con plantilla; la página del endpoint no publica ningún tope propio de destinatarios.
          - unit: MBs
            min: 1
            max: 10                                         # 🟢
            description: Tamaño del JSON de cada llamada a la API, adjuntos incluidos ya codificados.
      /messages/send-raw:
        demo:
          rate: rate_email_hourly_demo
          quota: quota_email_demo
        workload:
          - unit: emails
            min: 1
            max:                                            # 🔴
            description: Envío de un documento MIME crudo, tal cual saldría por SMTP.
          - unit: MBs
            min: 1
            max: 10                                         # 🟢
            description: Tamaño del JSON de cada llamada a la API, adjuntos incluidos ya codificados.
      /messages/search:
        rate: rate_request_search
        workload:
          - unit: requests
            min: 1
            max: 1
            description: Búsqueda en los mensajes recientes; sin rango de fechas devuelve los últimos siete días.
      /messages/search-time-series:
        workload:
          - unit: requests
            min: 1
            max: 1
            description: Búsqueda en los mensajes recientes que devuelve estadística agregada por hora.
      /messages/info:
        workload:
          - unit: requests
            min: 1
            max: 1
            description: Consulta de un mensaje reciente por identificador.
      /messages/content:
        workload:
          - unit: requests
            min: 1
            max: 1
            description: Consulta del contenido completo de un mensaje reciente.
      /rejects/list:
        workload:
          - unit: requests
            min: 1
            max: 1
            description: Consulta de la lista de rechazos; devuelve hasta 1.000 resultados por petición.
      /users/info:
        workload:
          - unit: requests
            min: 1
            max: 1
            description: Consulta del estado de la cuenta; devuelve la cuota horaria vigente, la reputación y el tamaño de la cola.

