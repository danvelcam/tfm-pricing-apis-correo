            description: Tamaño total del correo, adjuntos incluidos, hasta 30 MiB (31.457.280 bytes) de cuerpo de petición inclusive; un byte más devuelve 413 (verificado empíricamente en sandbox).

  pro:
    price: 89.95                                            # 🟢
    period:
      value: 1
      unit: MONTH
