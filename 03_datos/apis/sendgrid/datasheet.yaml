# Datasheet ACM2YAML v0.3 — SendGrid (Twilio SendGrid Email API)
# Semáforo: 🟢 explícito en fuente oficial · 🟡 inferido · 🔴 no documentado

associated_saas: sendgrid                                   # 🟢
type: api_first                                             # 🟢
url: https://www.twilio.com/en-us/products/email-api/pricing  # 🟢
syntax_version: 0.3
date: 2026-09-06
currency: USD                                               # 🟢
consumption_units:
  - requests
  - emails
  - MBs

capacity:
  quota_email_daily_free_trial:
    value: 100                                              # 🟢
    unit: emails
    period:
      value: 1
      unit: DAY
    window_type: fixed_utc_midnight                         # 🟢

  quota_email_monthly_essentials:
    value: 50000                                            # 🟢
    unit: emails
    period:
      value: 1
      unit: MONTH
    window_type: fixed_billing_cycle                        # 🟢
    overage_cost:
      price: 0.0013                                         # 🟢
      value: 1

  quota_email_monthly_pro:
    value: 100000                                           # 🟢
    unit: emails
    period:
      value: 1
      unit: MONTH
    window_type: fixed_billing_cycle                        # 🟢
    overage_cost:
      price: 0.0011                                         # 🟢
      value: 1

  quota_email_monthly_premier:
    value: custom                                           # 🟢
    unit: emails
    period:
      value: 1
      unit: MONTH
    window_type: fixed_billing_cycle                        # 🟡

max_power:
  rate_request_mailsend_free_trial:
    value: 10000                                            # 🟢
    unit: requests
    period:
      value: 1
      unit: SECOND
  rate_request_mailsend_essentials:
    value: 10000                                            # 🟢
    unit: requests
    period:
      value: 1
      unit: SECOND
  rate_request_mailsend_pro:
    value: 10000                                            # 🟢
    unit: requests
    period:
      value: 1
      unit: SECOND
  rate_request_mailsend_premier:
    value: 10000                                            # 🟢
    unit: requests
    period:
      value: 1
      unit: SECOND

plans:
  free_trial:
    price: 0.00                                             # 🟢
    period:
      value: 1
      unit: MONTH
    quota: quota_email_daily_free_trial
    rate: rate_request_mailsend_free_trial
    endpoints:
      /v3/mail/send:
        workload:
          - unit: emails
            min: 1
            max: 1000                                       # 🟢
            description: Hasta 1.000 sobres (personalizations) por petición y 1.000 destinatarios en total entre to, cc y bcc; cada destinatario consume una unidad.
          - unit: MBs
            min: 1
            max: 30                                         # 🟢
            description: Tamaño total del correo, adjuntos incluidos, hasta 30 MiB (31.457.280 bytes) de cuerpo de petición inclusive; un byte más devuelve 413 (verificado empíricamente en sandbox).

  essentials:
    price: 19.95                                            # 🟢
    period:
      value: 1
      unit: MONTH
    quota: quota_email_monthly_essentials
    rate: rate_request_mailsend_essentials
    endpoints:
      /v3/mail/send:
        workload:
          - unit: emails
