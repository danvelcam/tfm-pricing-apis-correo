  data_provenance:
    - "NOTA Test de type (C2/D9, 2026-09-14): las OCHO operaciones comprobadas contra la referencia de API, de ahi el verde, que mide cobertura del test y no el valor; el valor sigue siendo api_first. 1 envio; 2 plantillas, 'POST /v3/templates', sin restriccion publicada sobre las creadas en el editor web; 3 dominios, 'POST /v3/whitelabel/domains'; 4 credenciales con 'POST /v3/api_keys', mas Update API key name and scopes y Delete API keys; 5 webhooks con 'POST /v3/user/webhooks/event/settings', 'This endpoint allows you to create a new Event Webhook.', y sus Update, Delete y Toggle Signature Verification; 6 inbound routing con 'POST /v3/user/webhooks/parse/settings' (Inbound Parse), mas sus Retrieve, Update y Delete; 7 supresiones y rebotes con 'POST /v3/asm/suppressions/global' y 'GET /v3/suppression/bounces' con su Delete; 8 actividad con 'GET /v3/messages' (Email Activity Feed API). El escalon 2 recorrio el panel el mismo dia contra la lista de ocho. Cuatro operaciones estan en los dos lados; la 8 no: con esta cuenta la actividad existe en la web y no en la API, porque el panel da 3 dias en el plan y la API exige comprar el add-on de historico. Es la forma que C2 castiga, pero la 8 no es eliminatoria, asi que el type no cambia, 'To gain access to the Email Activity Feed API, purchase additional email activity history.' [https://www.twilio.com/docs/sendgrid/api-reference/email-activity/filter-all-messages], que es F-08 ya registrada, el endpoint entero detras de un add-on (registro operacion por operacion en la entrada F21 de fuentes.md) [https://www.twilio.com/docs/sendgrid/api-reference/api-keys/create-api-keys, consultado 2026-09-14]"
    - "El panel da la actividad con tres dias incluidos: 'Retrieve information about every email you have sent in the past 3 days by clicking Search.' y 'Up to 30 days of history is available for purchase.'; la Email Activity Feed API, en cambio, exige comprar el historico. Operacion 8 del test C2, no eliminatoria, y refuerzo de F-08 [observacion de panel con cuenta propia, 2026-09-14]"
    - "Tamaño máximo de la petición a /v3/mail/send: 31.457.280 bytes (30 MiB exactos) devuelve 200 en sandbox y 31.457.281 devuelve '413 Request Entity Too Large' de nginx antes de la aplicación; el «less than 30MB» documental es en la práctica «hasta 30 MiB inclusive» [verificación empírica en sandbox, evidencias/probe_tamano_30mib_biseccion_2026-09-07.json, 2026-09-07]"
    - "Prueba gratuita: 'Free trial lets you send 100 emails/day for 60 days', '$0/mo for 60 days', 'No credit card, no commitment.' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "La prueba caduca a los 60 días y después la cuenta no envía: 'After the 60 day trial period, email send via any web API or SMTP integration for the account will stop unless an appropriate \"Email API\" plan is chosen before then' [https://support.sendgrid.com/hc/en-us/articles/35270136965403-Twilio-SendGrid-Trial-Account-Plan]"
    - "Límite diario de la prueba: 'Send up to 100 email messages via web API or SMTP per day' [https://support.sendgrid.com/hc/en-us/articles/35270136965403-Twilio-SendGrid-Trial-Account-Plan]"
    - "La cuota de la prueba es tope duro, sin sobrecoste: 'The Free Trial plan covers storage of 100 contacts and sending 100 emails each day for 60 days. You can’t exceed these limitations.' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "Fecha de caducidad observada en la cuenta creada el 2026-09-06: 'Your plan will be downgraded to End Of Trial on November 5, 2026. This change will be reflected on your November invoice.' [https://app.sendgrid.com/account/products, observación de panel con cuenta propia, 2026-09-06]"
    - "Contador diario de la prueba: '0 emails sent today', '100 left', 'Upgrade your plan to send more than 100 emails/day.'; el panel no muestra hora ni zona horaria de reposición [https://app.sendgrid.com/account/products, observación de panel con cuenta propia, 2026-09-06]"
    - "Essentials desde $19.95/mes: 'Essentials plan starts at $19.95 per month', 'Send 50,000 - 100,000 emails/mo' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "Pro desde $89.95/mes: 'Starting at $89.95/mo', 'Send 100,000 - 2,500,000 emails/mo' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "Premier a medida: 'Custom pricing', 'Need to send more? Talk to us for custom, high volume pricing.' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "El precio depende del volumen contratado dentro del tier: 'Pricing is determined by monthly email volume and features. Select your email volume below to see which plans are right for you.' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "Volúmenes contratables y precio de cada uno (selector de volumen): 'Essentials 50k $19.95/mo 50,000 emails/mo', 'Essentials 100k $34.95/mo 100,000 emails/mo', 'Pro 100k $89.95/mo 100,000 emails/mo', 'Pro 300k $249.00/mo 300,000 emails/mo', 'Pro 700k $499.00/mo 700,000 emails/mo', 'Pro 1.5M $799.00/mo 1,500,000 emails/mo', 'Pro 2.5M $1,099.00/mo 2,500,000 emails/mo' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "Sobrecoste por email, que baja al subir el volumen contratado: 'Essentials 50K 50,000 $0.0013', 'Essentials 100K 100,000 $0.0009', 'Pro 100K 100,000 $0.0011', 'Pro 300K 300,000 $0.0009', 'Pro 700K 700,000 $0.0008', 'Pro 1.5M 1,500,000 $0.0006', 'Pro 2.5M 2,500,000 $0.0005', 'Premier Custom' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "El sobrecoste se aplica por ciclo de facturación y se factura al siguiente: 'If you send more emails than your email plan allows within a given billing period, you will be charged a small overage fee on a per-email basis. Any overage fees are added to your invoice for the following billing period.' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "Incoherencia del pricing (D17, DISC-01): el sobrecoste modelado es el de la página de precios (0.0013 en Essentials 50K); el panel lo publica con un decimal más (0.00133) y esas cifras quedan registradas aquí, no modeladas: 'Essentials 50K $19.95/month * Select 50.000 emails/month + $0.00133 per additional email', 'Pro 300K $249.00/month * Select 300.000 emails/month + $0.00091 per additional email', 'Pro 700K $499.00/month * Select 700.000 emails/month + $0.00078 per additional email', 'Pro 1.5 Million $799.00/month * Select 1.500.000 emails/month + $0.00059 per additional email', 'Pro 2.5 Million $1,099.00/month * Select 2.500.000 emails/month + $0.00047 per additional email'; coinciden 'Essentials 100K $34.95/month * Select 100.000 emails/month + $0.0009 per additional email' y 'Pro 100K $89.95/month * Select 100.000 emails/month + $0.0011 per additional email' [https://app.sendgrid.com/account/billing/choose_plan, observación de panel con cuenta propia, 2026-09-06]"
    - "Sin sobrecoste cuando la cuenta se contrató por un tercero: 'If you created your SendGrid account through Heroku or Google Cloud, your subscription does not allow for overages.' [https://www.twilio.com/en-us/products/email-api/pricing; https://support.sendgrid.com/hc/en-us/articles/40779261694875-Twilio-SendGrid-Overage-Rates]"
    - "La cuota se consume por destinatario, también si el correo acaba diferido o en spam: 'Every time you send one email to one recipient, it’s deducted as one email credit from your SendGrid Email API plan. This occurs whether the email is ultimately deferred or sent to spam by the inbox provider.' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "Caudal publicado solo para el envío: 'There are rate limits on how frequently you can call the v3 Mail Send endpoint. You may make up to 10,000 requests per second to the endpoint. Each email you send may include up to 1000 recipients.' [https://www.twilio.com/docs/sendgrid/for-developers/sending-email/v3-mail-send-faq]"
    - "El endpoint de envío está en todos los planes y la cuota del plan se le aplica: 'The v3 Mail Send endpoint is available on all SendGrid pricing plans. The same plan based limitations on the volume of email you may send still apply to the v3 Mail Send endpoint.' [https://www.twilio.com/docs/sendgrid/for-developers/sending-email/v3-mail-send-faq]"
    - "El resto de endpoints tiene un límite fijo cuyo valor no se publica: 'Each endpoint permits a fixed number of requests per refresh period. If you exceed that limit, the API returns an HTTP 429 (Too Many Requests) status code.' [https://www.twilio.com/docs/sendgrid/api-reference/how-to-use-the-sendgrid-v3-api/rate-limits]"
    - "Cabeceras de caudal en cada respuesta: 'X-RateLimit-Limit: 500', 'X-RateLimit-Remaining: 499', 'X-RateLimit-Reset: 1392815263' (valores del ejemplo, no del contrato) [https://www.twilio.com/docs/sendgrid/api-reference/how-to-use-the-sendgrid-v3-api/rate-limits]"
    - "Al agotar el límite: 'When you reach a rate limit, you can no longer make requests against that endpoint for the remainder of the refresh period, and the API returns a 429 response.' [https://www.twilio.com/docs/sendgrid/api-reference/how-to-use-the-sendgrid-v3-api/rate-limits]"
    - "429 documentado como 'Too many requests or rate limit exceeded'; y un bloqueo temporal aparte, 'You are temporarily blocked from sending emails due to repeated bad requests.' (403) [https://www.twilio.com/docs/sendgrid/api-reference/how-to-use-the-sendgrid-v3-api/responses]"
    - "Tope de destinatarios por petición, total y explícito: 'The total number of recipients must be no more than 1,000. This includes all recipients defined within the to, cc, and bcc parameters, across each object that you include in the personalizations array.' [https://www.twilio.com/docs/sendgrid/api-reference/mail-send]"
    - "Tamaño de la petición: 'The total size of your email, including attachments, must be less than 30MB.' [https://www.twilio.com/docs/sendgrid/api-reference/mail-send]"
    - "Sobres por petición: 'Each API request has a limit of 1,000 personalization objects. To include more than 1,000, divide the objects across multiple API requests.' [https://www.twilio.com/docs/sendgrid/for-developers/sending-email/personalizations]"
    - "Otros topes del cuerpo: 'Total custom_args size may not exceed 10,000 bytes.', categorías 'Max items: 10', 'A send cannot be scheduled more than 72 hours in advance.' [https://www.twilio.com/docs/sendgrid/api-reference/mail-send/mail-send]"
    - "Ruta y base del endpoint: 'POST/v3/mail/send', 'Base url: https://api.sendgrid.com (for global users and subusers)', 'Base url: https://api.eu.sendgrid.com (for EU regional subusers)' [https://www.twilio.com/docs/sendgrid/api-reference/mail-send/mail-send]"
    - "La superficie del endpoint depende del plan: 'Regional Email sending in the European Union (EU) is available for Twilio SendGrid Pro plan or above' y la compresión gzip 'is available to some high volume accounts' por solicitud a soporte [https://www.twilio.com/docs/sendgrid/api-reference/mail-send/mail-send]"
    - "Modo de pruebas sin consumo: 'Sandbox mode is an optional parameter within mail_settings that validates a Mail Send request without delivering the email.', 'No Credits will be consumed.' [https://www.twilio.com/docs/sendgrid/for-developers/sending-email/sandbox-mode]"
    - "IP dedicada incluida en Pro y Premier, una por plan, y ampliable: 'Pro and premier plans include dedicated IPs, with option to purchase more', '*You can purchase additional IPs as an add-on'; no disponible en Free Trial ni Essentials [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "Add-on de IP dedicada: 'Additional Dedicated IP Addresses $30/month* each', 'Note: You have 0 dedicated IP included with your plans' [https://app.sendgrid.com/account/products/addons, observación de panel con cuenta propia, 2026-09-06]"
    - "Add-ons condicionados al plan: 'Upgrade to a paid Email API plan or a paid Marketing Campaigns plan for this add-on.' (créditos de prueba, 'Monthly credit bundles starting at $18/month*'), 'Upgrade to an Email API Pro plan for this add-on.' (validación de direcciones, 'Pricing varies per plan and volume.') [https://app.sendgrid.com/account/products/addons, observación de panel con cuenta propia, 2026-09-06]"
    - "Paquetes de créditos de prueba: '30 Email Testing credits per month, available for $18.00 USD', '60 Email Testing credits per month, available for $30.00 USD', '500 Email Testing credits per month, available for $200.00 USD', '2,000 Email Testing credits per month, available for $800.00 USD' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "Límites de recursos por plan, no de consumo: 'Additional teammates: 1' en Free Trial y Essentials frente a 'Additional teammates: 1,000' en Pro y Premier; webhooks de eventos 'Event Webhook 1 included 2 included 5 included 5 included'; validaciones de direcciones 'Email validation: 2,500' en Pro y 'Email validation: 5,000' en Premier, ninguna en los otros dos [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "Historial de actividad por plan: 'Searchable Email Activity 3 days included 3 days included 7 days of history 7 days of history*', con '*Not available to Premier 100M and above' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "Créditos de prueba incluidos: la página de precios dice '60 credits/mo (more for purchase)' para Pro y Premier, y por D17 vale 60 en los dos; el panel dice '60 Email Testing Credits' en Pro y '500 Email Testing Credits' en Premier, y el 500 queda como incoherencia del pricing (DISC-02) [https://www.twilio.com/en-us/products/email-api/pricing; https://app.sendgrid.com/account/billing/choose_plan, observación de panel con cuenta propia, 2026-09-06]"
    - "Funciones que solo existen desde Pro: 'No Subuser Management', 'No Regional Data Residency', 'No Access to Dedicated IPs', 'No Access to Email Validation' en Free y Essentials; 'Subuser Management', 'Regional Data Residency', 'Dedicated IP Included' en Pro y Premier [https://app.sendgrid.com/account/billing/choose_plan, observación de panel con cuenta propia, 2026-09-06]"
    - "Dos productos contratados por separado bajo la misma cuenta: 'Yes! If you want to use Marketing Campaigns and the Email API, you will need to purchase the email plans separately.' y 'Also note that emails you send via Marketing Campaigns will be counted separately from any emails you send via the SendGrid Email API.' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "Contadores independientes de los dos productos en el panel: 'Up to 100 contacts and 100 marketing emails/day', '0 unique contacts stored this month', '0 marketing emails sent today' [https://app.sendgrid.com/account/products, observación de panel con cuenta propia, 2026-09-06]"
    - "El panel no tiene formulario de envío para el Email API: la guía de integración ofrece 'Use Web API or SMTP' o 'Use Marketing Campaigns', y el único envío desde la interfaz es 'Send a single send' (producto de marketing); la sección Email API del menú se limita a plantillas y guía de integración. type = api_first sobre el producto modelado [https://app.sendgrid.com/guide, observación de panel con cuenta propia, 2026-09-06]"
    - "El plan Free permanente se retiró en 2025: 'Twilio SendGrid will be retiring its Free Email API and Free Marketing Campaigns plan starting May 27, 2025.' [https://www.twilio.com/en-us/changelog/sendgrid-free-plan]"
    - "La baja de un plan de pago no vuelve a un plan gratuito: 'At the turn of the month, the plan will be on the \"end of trial\" plan status which will not allow for email send' [https://support.sendgrid.com/hc/en-us/articles/35270136965403-Twilio-SendGrid-Trial-Account-Plan]"
    - "Sin identidad de remitente verificada no se puede enviar: 'From address doesn’t match Verified Sender Identity' (403) [https://www.twilio.com/docs/sendgrid/api-reference/how-to-use-the-sendgrid-v3-api/responses]"
    - "Canal SMTP con su propio caudal publicado: 'You may send up to 5k messages per SMTP connection.' y 'You may open up to 10k concurrent connections from a single server.' [https://www.twilio.com/docs/sendgrid/for-developers/sending-email/integrating-with-the-smtp-api]"
    - "Por SMTP el tope de destinatarios es diez veces el de la API: 'There is a hard limit of 10,000 addresses in a multiple recipient email. However, the best practice is to split large jobs into separate transactions of approximately 1,000 recipients' [https://www.twilio.com/docs/sendgrid/for-developers/sending-email/building-an-x-smtpapi-header]"
    - "El endpoint de actividad solo existe tras comprar un add-on: 'To gain access to the Email Activity Feed API, purchase additional email activity history.'; con el add-on 'the feed retains events for up to 30 days'; consulta paginada 'This parameter must be greater than 0 and less than or equal to 1000' y 'Combine up to 160 filter conditions per request.' [https://www.twilio.com/docs/sendgrid/api-reference/email-activity/filter-all-messages; https://www.twilio.com/docs/sendgrid/ui/analytics-and-reporting/email-activity-feed]"
    - "La validación de direcciones solo existe desde Pro: 'Email Address Validation is available to Email API Pro and Premier level accounts only.'; 'There is a limit of 50 sources.' [https://www.twilio.com/docs/sendgrid/api-reference/email-address-validation/validate-an-email]"
    - "Quinto paquete de créditos de prueba, con errata de precio en la página: '100 Email Testing credits per month, available for $40.000 USD' [https://www.twilio.com/en-us/products/email-api/pricing]"
    - "Sustituciones por sobre: 'Limit of 150 substitutions per personalization block.' [https://www.twilio.com/docs/sendgrid/for-developers/sending-email/personalizations]"
    - "Los dos ejemplos de la página de rate limits usan límites distintos, 'X-RateLimit-Limit: 500' en el 200 y 'X-RateLimit-Limit: 150' en el 429: son ilustrativos, no contractuales [https://www.twilio.com/docs/sendgrid/api-reference/how-to-use-the-sendgrid-v3-api/rate-limits]"
    - "La prueba limita también el producto de marketing: 'Send up to 100 email messages via Marketing Campaigns per day', 'Store up to 100 contacts (during the 60 day period) within Marketing Campaigns' [https://support.sendgrid.com/hc/en-us/articles/35270136965403-Twilio-SendGrid-Trial-Account-Plan]"
