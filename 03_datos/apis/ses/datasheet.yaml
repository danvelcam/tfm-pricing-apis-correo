# Datasheet ACM2YAML v0.3 — Amazon SES (Email API v2)
# Semáforo: 🟢 explícito en fuente oficial · 🟡 inferido · 🔴 no documentado

associated_saas: amazon-ses                                 # 🟢
type: api_first                                             # 🟢
url: https://aws.amazon.com/ses/pricing/                    # 🟢
