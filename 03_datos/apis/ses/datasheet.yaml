      value: 1
      unit: MONTH
    endpoints:
      /*:
        rate: rate_request_other
      /v2/email/outbound-emails:
        sandbox:
          rate: rate_request_send_sandbox
          quota: quota_email_daily_sandbox
        workload:
          - unit: emails
            min: 1
            max: 50                                         # 🟢
            description: Envío individual; hasta 50 destinatarios por mensaje sumando to, cc y bcc, y cada destinatario consume una unidad de la cuota.
          - unit: MBs
            min: 1
            max: 40                                         # 🟢
            description: Tamaño del mensaje con adjuntos, tras codificar en base64; por encima de 10 MB el proveedor limita el ancho de banda.
      /v2/email/outbound-bulk-emails:
        sandbox:
          rate: rate_request_send_sandbox
          quota: quota_email_daily_sandbox
