plans:
  free:
    price: 0.00                                             # 🟢
    period:
      value: 1
      unit: MONTH
    quota: quota_request_daily_free
    endpoints:
      /*:
        rate: rate_request_general_free
      /v1/email:
        quota: quota_email_monthly_free
        healthy_reputation:
          rate: rate_request_email_free
        under_review_reputation:
          rate: rate_request_email_under_review
        unapproved_account:
          rate: rate_request_email_unapproved
          quota: quota_email_monthly_unapproved
          workload:
            - unit: emails
              min: 1
              max: 2                                        # 🟡
              description: Cuenta sin aprobar; máximo por petición de dos destinatarios sumando to, cc y bcc, que es la mayor combinación que pasa la validación (to 1 más cc 1), frente a los 10 en to, 1 en cc y 1 en bcc que publica la documentación (DISC-18). El tope de dos destinatarios únicos por cuenta es otra dimensión y no se modela; ver metadata.not_found. Medido el 2026-09-14 en la tanda 3, ese cupo de cuenta se agota con direcciones probadas aunque el mensaje no salga, y una vez agotado ni siquiera to 1 más cc 1 pasa, así que este máximo describe el tope de la petición y no lo que la cuenta admite hoy.
        workload:
          - unit: emails
            min: 1
            max: 70                                         # 🟡
            description: Envío individual; hasta 50 destinatarios en to más 10 en cc y 10 en bcc, cada destinatario consume una unidad.

  hobby:
    price: 7.00                                             # 🟢
    period:
      value: 1
      unit: MONTH
    quota: quota_request_daily_hobby
    endpoints:
      /*:
        rate: rate_request_general_hobby
      /v1/email:
        quota: quota_email_monthly_hobby
        healthy_reputation:
          rate: rate_request_email_hobby
        under_review_reputation:
          rate: rate_request_email_under_review
        unapproved_account:
          rate: rate_request_email_unapproved
          quota: quota_email_monthly_unapproved
          workload:
            - unit: emails
              min: 1
              max: 2                                        # 🟡
              description: Cuenta sin aprobar; máximo por petición de dos destinatarios sumando to, cc y bcc, que es la mayor combinación que pasa la validación (to 1 más cc 1), frente a los 10 en to, 1 en cc y 1 en bcc que publica la documentación (DISC-18). El tope de dos destinatarios únicos por cuenta es otra dimensión y no se modela; ver metadata.not_found. Medido el 2026-09-14 en la tanda 3, ese cupo de cuenta se agota con direcciones probadas aunque el mensaje no salga, y una vez agotado ni siquiera to 1 más cc 1 pasa, así que este máximo describe el tope de la petición y no lo que la cuenta admite hoy.
        workload:
          - unit: emails
            min: 1
            max: 70                                         # 🟡
            description: Envío individual; hasta 50 destinatarios en to más 10 en cc y 10 en bcc, cada destinatario consume una unidad.
      /v1/bulk-email:
        quota: quota_email_monthly_hobby
        healthy_reputation:
          rate: rate_request_bulk_hobby
        under_review_reputation:
          rate: rate_request_bulk_under_review
        unapproved_account:
          rate: rate_request_bulk_unapproved
          quota: quota_email_monthly_unapproved
          workload:
            - unit: emails
              min: 1
              max: 5                                        # 🟡
              description: Cuenta sin aprobar; cinco objetos de correo por llamada en vez de 500, y un destinatario en to por objeto (el tope de to medido sin aprobar), de ahí las cinco unidades.
            - unit: MBs
              min: 1
              max: 50                                       # 🟢
              description: Tamaño total del cuerpo JSON de la petición, hasta 50 MB.
        workload:
          - unit: emails
            min: 1
            max: 35000                                      # 🟢
            description: Hasta 500 objetos de correo por llamada, cada uno con hasta 50 to, 10 cc y 10 bcc; cada destinatario consume una unidad.
          - unit: MBs
            min: 1
            max: 50                                         # 🟢
            description: Tamaño total del cuerpo JSON de la petición, hasta 50 MB.

