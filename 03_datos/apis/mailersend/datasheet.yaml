  data_provenance:
    - "Test de type (C2, D-031): editar una plantilla creada en el panel no es posible por API, 'Only templates created via API' y 'templates created in the MailerSend app return 404'; crear si lo es (POST /v1/templates). Es la operacion eliminatoria 2 del test, de ahi partial_saas. La frase estaba recogida en fuentes.md desde el 2026-09-08 y marcada VERBATIM DUDOSO; el volcado del 14-09 cierra CD-18 y retira la marca. Lo que faltaba no era la evidencia, era conectarla con type, que hasta D-031 se juzgaba con C1, es decir mirando solo el envio [https://developers.mailersend.com/api/v1/email/templates, consultado 2026-09-14]"
    - "NOTA Test de type (D9, el color mide cobertura): las OCHO operaciones comprobadas, de ahi el verde. 1 envio (/v1/email, /v1/bulk-email); 2 plantillas; 3 dominios ('Add a domain', 'Get DNS Records', 'Get verification status'); 4 rotacion de credenciales (POST/PUT/DELETE /v1/token); 5 webhooks (POST/PUT/DELETE /v1/webhooks); 6 inbound; 7 supresiones, con GET, POST y DELETE sobre blocklist, hard-bounces, spam-complaints y unsubscribes mas on-hold-list, documentadas dentro de la pagina de Recipients y no en una propia; 8 actividad. El verde es de cobertura del test, no del valor: el valor sigue siendo partial_saas porque la operacion 2 falla [https://developers.mailersend.com/api/v1/email/recipients, consultado 2026-09-14]"
    - "Cuatro planes con precio publicado (Professional, Starter, Hobby y Free, este último a $0) y un Enterprise a medida sin tarjeta en la página de precios: 'If you are sending emails for a large enterprise and have special requirements, we can also provide a custom Enterprise plan.' [https://www.mailersend.com/help/plans-features-and-limits]"
    - "Free: 'Get started for free — includes:', '500 emails /month', 'Email API and SMTP relay'; y en la FAQ 'This plan lets you send up to 500 emails per month for free!' [https://www.mailersend.com/pricing]"
    - "El Free exige tarjeta y aprobación previa: 'Once your account is approved, you can subscribe to a Free plan.', 'we just ask that you provide this information to prevent abuse of the platform.' [https://www.mailersend.com/pricing]"
    - "Cuota mensual y diaria del Free, ambas en emails: 'Once approved, the Free plan allows you to send up to 500 emails a month for free, with a daily limit of 100 emails.' [https://www.mailersend.com/help/plans-features-and-limits]"
    - "NOTA (no es un dato): el límite diario de 100 emails del Free no se define en capacity. Es la única de las cinco fuentes que lo expresa en emails y las otras cuatro dicen peticiones (DISC-11), y ningún plan puede referenciarlo sin duplicar la cuota diaria de peticiones que ya lleva; el literal se queda en este provenance y el hueco en metadata.not_found (D-029, regla B7)"
    - "El Free es tope duro y pausa el envío al agotarse: 'If you reach this limit within the 30-day usage period, your sendings will be paused until a new period begins and your email limit is reset.' [https://www.mailersend.com/help/plans-features-and-limits]"
    - "Sin sobrecoste en los tres estados gratuitos: 'we bill extra emails at a set rate per 1,000 on your next invoice', 'the Free plan, or the Professional trial, none of which allow extra usage' [https://www.mailersend.com/help/plans-features-and-limits]"
    - "Hobby $7.00 al mes por 5.000 emails: '$7.00 /month', '5,000 emails /month', 'Extra usage $1.50 /1,000 emails', '1,000 daily API requests'; 'The Hobby plan costs $7 per month, or $6.30 per month with an annual plan.' [https://www.mailersend.com/pricing; https://www.mailersend.com/help/plans-features-and-limits]"
    - "Sobrecoste de Hobby: 'you can continue to send emails at a metered rate of $1.50 per 1,000 additional emails sent.'; 'For Hobby plans, the price is $1.50 per 1,000 emails' [https://www.mailersend.com/help/plans-features-and-limits; https://www.mailersend.com/help/how-to-set-a-billing-limit]"
    - "Starter desde $35.00 al mes por 50.000 emails (primer volumen contratable): '$35.00 /month', '50,000 emails /month', 'Extra usage $1.30 /1,000 emails', '100,000 daily API requests'; 'Starter plans start from as little as $35 a month, or $31.50 a month with an annual plan, for an allowance of 50,000 emails per month.' [https://www.mailersend.com/pricing; https://www.mailersend.com/help/plans-features-and-limits]"
    - "Professional desde $110.00 al mes por 50.000 emails (primer volumen contratable): '$110.00 /month', '50,000 emails /month', 'Extra usage $1.30 /1,000 emails', '500,000 daily API requests'; 'Professional plans start at $110 a month, or $99 a month with an annual plan, for an allowance of 50,000 emails per month.' [https://www.mailersend.com/pricing; https://www.mailersend.com/help/plans-features-and-limits]"
    - "El precio de Starter y Professional lo fija un selector de volumen: 'How many emails do you plan to send?', 'You can select your plan size based on the number of emails you expect you’ll need to send.', 'Save money as you send more emails!' [https://www.mailersend.com/pricing; https://www.mailersend.com/help/plans-features-and-limits]"
    - "Volúmenes contratables de Starter con pago mensual (selector accionado con el navegador): '$35.00 /month' por '50,000 emails /month', '$68.00 /month' por '100,000 emails /month', '$162.50 /month' por '250,000 emails /month', '$325.00 /month' por '500,000 emails /month', '$600.00 /month' por '1,000,000 emails /month'; en las posiciones 1,5M y 2M la tarjeta Starter repite '$600.00 /month' y '1,000,000 emails /month' [https://www.mailersend.com/pricing]"
    - "Volúmenes contratables de Professional con pago mensual: '$110.00 /month' por '50,000 emails /month', '$140.00 /month' por '100,000 emails /month', '$275.00 /month' por '250,000 emails /month', '$525.00 /month' por '500,000 emails /month', '$1,000.00 /month' por '1,000,000 emails /month', '$1,350.00 /month' por '1,500,000 emails /month', '$1,600.00 /month' por '2,000,000 emails /month' [https://www.mailersend.com/pricing]"
    - "El sobrecoste baja con el volumen contratado y difiere entre tiers al mismo volumen: Starter 'Extra usage $1.30 /1,000 emails' (50.000 y 100.000), 'Extra usage $1.10 /1,000 emails' (250.000 y 500.000), 'Extra usage $1.00 /1,000 emails' (1.000.000); Professional 'Extra usage $1.30 /1,000 emails' (50.000 y 100.000), 'Extra usage $1.00 /1,000 emails' (250.000), 'Extra usage $0.80 /1,000 emails' (500.000), 'Extra usage $0.60 /1,000 emails' (1.000.000 y 1.500.000), 'Extra usage $0.50 /1,000 emails' (2.000.000) [https://www.mailersend.com/pricing]"
