      /v3/{domain_name}/events:
        workload:
          - unit: requests
            min: 1
            max: 1
            description: Consulta de eventos; hasta 300 entradas por petición.
      /v4/domains:
        workload:
          - unit: requests
            min: 1
            max: 1
            description: Alta de un dominio de envío por petición.
      /v3/{domain_name}/templates:
        workload:
          - unit: requests
            min: 1
            max: 1
            description: Alta de una plantilla por petición; hasta 100 plantillas y 40 versiones por plantilla en la cuenta.
