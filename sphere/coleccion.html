<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APIs de correo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  /* Tokens copiados de SPHERE (sphere.score.us.es, frontend/src/modules/core/theme) */
  :root {
    --ink: #1f1f1f;
    --muted: #6a6a6a;
    --line: #b8b8b8;
    --line-soft: #e4e4e4;
    --field: #c7c7c7;
    --chip: #fafafa;
    --page: #ffffff;
    --surface: #ffffff;
    --orange: #fa520f;
    --orange-deep: #cc3a05;
    --navy: #023e8a;
    --ext: #0369a1;
    --ext-soft: #e0f2fe;
    --tfm-soft: #fff1ea;
    --track: linear-gradient(90deg, #fa520f 0%, #ffa110 35%, #ffb83e 55%, #ffd900 75%, #fff8e0 100%);
    --plan-1: linear-gradient(135deg, #fa520f, #cc3a05);
    --plan-2: linear-gradient(135deg, #e68a00, #b36b00);
    --plan-3: linear-gradient(135deg, #14b8a6, #0f766e);
    --plan-4: linear-gradient(135deg, #0ea5e9, #0369a1);
    --plan-5: linear-gradient(135deg, #8b5cf6, #6d28d9);
    --nav-shadow: 0 6px 26px rgba(15, 23, 42, .08);
    --serif: "Instrument Serif", "PP Editorial Old", "Times New Roman", Georgia, serif;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ececec; --muted: #a3a3a3; --line: #4a4a4a; --line-soft: #2e2e2e; --field: #555;
      --chip: #232323; --page: #141414; --surface: #1b1b1b; --ext: #7dd3fc; --ext-soft: #0c2a3d;
      --tfm-soft: #3a1c0e; --nav-shadow: 0 6px 26px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --ink: #ececec; --muted: #a3a3a3; --line: #4a4a4a; --line-soft: #2e2e2e; --field: #555;
    --chip: #232323; --page: #141414; --surface: #1b1b1b; --ext: #7dd3fc; --ext-soft: #0c2a3d;
    --tfm-soft: #3a1c0e; --nav-shadow: 0 6px 26px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 400 16px/1.5 var(--sans); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 6px; }

  /* Barra de navegación en píldora, como la de SPHERE */
  .nav { position: sticky; top: 12px; z-index: 10; margin: 12px auto 0; max-width: 1180px; padding: 0 16px; }
  .nav-inner { display: flex; align-items: center; gap: 28px; padding: 12px 14px 12px 22px; background: var(--surface);
    border: 1px solid var(--line-soft); border-radius: 9999px; box-shadow: var(--nav-shadow); }
  .brand { font-size: 14px; letter-spacing: 3.08px; font-weight: 500; }
  .nav-links { display: flex; gap: 22px; font-size: 13px; letter-spacing: 1.2px; color: var(--muted); }
  .nav-links b { color: var(--ink); font-weight: 500; }
  .nav-spacer { flex: 1; }
  .nav-pill { border: 1px solid var(--field); border-radius: 9999px; padding: 6px 16px; font-size: 13px; color: var(--muted); }

  main { max-width: 1180px; margin: 0 auto; padding: 28px 16px 64px; }
  .crumbs { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .crumbs button { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; }
  .crumbs button:hover { color: var(--ink); }
  .crumbs [aria-current] { color: var(--ink); }

  .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; margin-top: 12px; }

  /* Árbol de clasificación */
  .tree { position: sticky; top: 92px; align-self: start; border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 10px; background: var(--surface); }
  .tree h2 { font: 400 22px/1.2 var(--serif); margin: 4px 8px 4px; }
  .tree p.lede { font-size: 12px; color: var(--muted); margin: 0 8px 12px; }
  .tree ul { list-style: none; margin: 0; padding: 0; }
  .tree ul ul { padding-left: 14px; border-left: 1px solid var(--line-soft); margin-left: 13px; }
  .node { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: none; border: 0;
    padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
  .node:hover { background: var(--chip); }
  .node .chev { width: 14px; flex: none; color: var(--muted); transition: transform .15s; font-size: 11px; }
  .node[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .node .count { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--chip);
    border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 6px; white-space: nowrap; flex: none; }
  .node.leaf .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); flex: none; margin: 0 3px; }
  .node.leaf.pending { color: var(--muted); }
  .node.leaf.pending .dot { background: transparent; border: 1px dashed var(--line); }
  .node[aria-selected="true"] { background: var(--tfm-soft); font-weight: 500; }
  .node .kind { font-size: 11px; color: var(--muted); font-weight: 400; }

  /* Cabecera de la hoja */
  .title-row { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  h1 { font: 400 40px/1.1 var(--serif); margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--orange); color: #fff; border: 0;
    border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 500; cursor: pointer; margin-left: auto; }
  .btn:hover { background: var(--orange-deep); }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 20px 0 28px; }
  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
  .stat span { display: block; font-size: 11px; color: var(--muted); }
  .stat strong { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Timeline: la pieza nueva */
  .timeline { border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px 20px; background: var(--surface); }
  .tl-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .tl-head h2 { font: 400 24px/1.2 var(--serif); margin: 0; }
  .tl-date { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .src { font-size: 11px; border-radius: 4px; padding: 2px 8px; }
  .src.tfm { background: var(--tfm-soft); color: var(--orange-deep); }
  .src.ext { background: var(--ext-soft); color: var(--ext); }
  .src.truth { background: var(--chip); color: var(--muted); border: 1px solid var(--line-soft); }
  :root[data-theme="dark"] .src.tfm { color: #ffb48f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .src.tfm { color: #ffb48f; } }
  .tl-note { font-size: 13px; color: var(--muted); margin: 6px 0 0; max-width: 72ch; }

  .rail { position: relative; height: 74px; margin: 18px 10px 0; touch-action: none; user-select: none; cursor: pointer; }
  .rail .base { position: absolute; left: 0; right: 0; top: 22px; height: 6px; border-radius: 9999px; background: var(--line-soft); }
  .rail .fill { position: absolute; left: 0; top: 22px; height: 6px; border-radius: 9999px; background: var(--track);
    background-size: var(--rail-w, 100%) 100%; }
  .stop { position: absolute; top: 25px; transform: translate(-50%, -50%); width: 14px; height: 14px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--line); padding: 0; cursor: pointer; }
  .stop.ext { border-style: dashed; border-color: var(--ext); }
  .stop.tfm { border-color: var(--orange); }
  .stop.past { background: var(--orange); border-color: var(--orange); }
  .stop.ext.past { background: var(--ext); border-color: var(--ext); }
  .stop-label { position: absolute; top: 44px; transform: translateX(-50%); font-size: 11px; color: var(--muted);
    white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; }
  .stop-label.edge-l { transform: none; }
  .stop-label.edge-r { transform: translateX(-100%); }
  .marker { position: absolute; top: 25px; width: 26px; height: 26px; transform: translate(-50%, -50%); border-radius: 50%;
    background: var(--surface); border: 3px solid var(--ink); box-shadow: 0 2px 10px rgba(0,0,0,.18); cursor: grab; z-index: 2; }
  .marker.dragging { cursor: grabbing; }
  .marker.animate { transition: left .25s cubic-bezier(.2, .8, .2, 1); }
  .marker .tip { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page);
    font-size: 11px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; transition: opacity .12s; pointer-events: none; }
  .marker.dragging .tip, .marker:focus-visible .tip { opacity: 1; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--orange); vertical-align: -1px; margin-right: 6px; }
  .legend i.ext { border: 2px dashed var(--ext); }
  .single { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 16px; }

  /* Tabla de planes, cabeceras en degradado como en SPHERE */
  .plans { margin-top: 24px; border: 1px solid var(--line); border-radius: 16px; padding: 20px; background: var(--surface); overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 560px; }
  th.plan { color: #fff; padding: 14px 10px; text-align: center; vertical-align: top; min-width: 112px; }
  th.plan .pname { display: block; font-size: 17px; font-weight: 700; letter-spacing: .2px; }
  th.plan .pprice { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  th.plan .pper { display: block; font-size: 12px; font-weight: 500; opacity: .9; }
  th.plan:nth-child(2) { border-top-left-radius: 10px; }
  th.plan:last-child { border-top-right-radius: 10px; }
  tbody th { text-align: left; font-size: 14px; font-weight: 600; padding: 14px 12px 14px 0; min-width: 150px; }
  tbody th small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  td { text-align: center; padding: 12px 6px; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .pill { display: inline-block; background: var(--orange); color: #fff; border-radius: 9999px; padding: 3px 12px;
    font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill.none { background: transparent; color: var(--muted); border: 1px dashed var(--line); font-weight: 400; }
  .was { display: block; font-size: 11px; color: var(--muted); text-decoration: line-through; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .changed .pill { box-shadow: 0 0 0 3px var(--tfm-soft); }
  .gone { opacity: .45; }
  .plans-foot { font-size: 12px; color: var(--muted); margin: 14px 0 0; }

  /* Vista de colección (nodo interior seleccionado) */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 20px; }
  .card { text-align: left; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--surface); cursor: pointer; }
  .card:hover { border-color: var(--ink); }
  .card .who { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .badge { width: 20px; height: 20px; border-radius: 6px; background: var(--navy); color: #fff; font-size: 8px; font-weight: 600;
    display: grid; place-items: center; }
  .card h3 { font-size: 14px; font-weight: 500; margin: 10px 0 10px; }
  .card .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .card .meta span { background: var(--chip); border-radius: 4px; padding: 1px 6px; }
  .card.pending { border-style: dashed; cursor: default; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .tree { position: static; }
    .nav-links { display: none; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    h1 { font-size: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .marker.animate, .node .chev { transition: none; }
  }

  /* Pestañas Pricing / Términos de consumo */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 20px; }
  .tabs [role=tab] { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 16px 9px; font-size: 15px;
    font-weight: 500; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
  .tabs [role=tab]:hover { color: var(--ink); }
  .tabs [role=tab][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--orange); }
  .stat small { font-size: 12px; font-weight: 500; color: var(--muted); }

  .block { margin-top: 24px; border: 1px solid var(--line); border-radius: 16px; padding: 20px; background: var(--surface); min-width: 0; }
  .block h3 { font: 400 24px/1.2 var(--serif); margin: 0; }
  .block .sub { margin: 4px 0 14px; font-size: 13px; }
  .h4 { font-size: 13px; font-weight: 600; margin: 18px 0 6px; }
  .block > .h4:first-of-type { margin-top: 12px; }
  .scroll { overflow-x: auto; }
  .small { font-size: 13px; margin: 0; }
  .none { color: var(--muted); }
  .line { display: block; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .line small, td small { display: block; color: var(--muted); font-size: 11px; }
  td.left { text-align: left; vertical-align: top; }
  table.detail td { min-width: 150px; }
  tr.group th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 18px 0 6px; border-bottom: 1px solid var(--line); }
  .yes { color: var(--orange-deep); font-weight: 700; }
  code { font-size: 12px; background: var(--chip); border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }

  /* Semáforo de la Datasheet */
  .lt { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: 1px; margin-left: 4px; }
  .lt.g { background: #16a34a; } .lt.a { background: #eab308; } .lt.r { background: #dc2626; }

  /* Tablas clave-valor de los términos */
  table.kv { min-width: 0; }
  table.kv th { text-align: left; font-size: 13px; font-weight: 500; padding: 7px 12px 7px 0; vertical-align: top; width: 42%; border-bottom: 1px solid var(--line-soft); }
  table.kv td { text-align: left; padding: 7px 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  table.wl th { width: auto; }
  table.wl thead th, table.hist thead th { font-size: 12px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); text-align: left; padding: 6px 8px 6px 0; }
  table.wl td.desc { color: var(--muted); font-size: 12px; max-width: 46ch; padding-left: 12px; }
  table.wl td { min-width: 130px; }

  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .cols .block { margin-top: 20px; }

  /* Filtros por tipo de cambio */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .fchip { border: 1px solid var(--field); background: var(--surface); border-radius: 9999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .fchip span { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 2px; }
  .fchip[aria-pressed="true"] { border-color: var(--ink); background: var(--chip); }
  .fchip[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
  .fchip::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; background: var(--c); }
  .quota { --c: #fa520f; } .rate { --c: #0369a1; } .rep { --c: #8b5cf6; }
  .tchip { display: inline-block; font-size: 11px; border-radius: 4px; padding: 1px 6px; white-space: nowrap;
    color: var(--c); border: 1px solid var(--c); }

  /* Diff de una versión */
  .diff { border-left: 3px solid var(--c); padding: 8px 0 8px 14px; margin-top: 12px; }
  .diff header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .diff p { margin: 6px 0 0; font-size: 13px; }
  .diff p span { display: inline-block; min-width: 64px; font-size: 11px; color: var(--muted); }
  .diff .before { color: var(--muted); }
  .diff .why { font-size: 12px; color: var(--muted); font-style: italic; }

  table.hist { min-width: 720px; }
  table.hist td { text-align: left; vertical-align: top; font-size: 12.5px; padding: 8px 8px 8px 0; }
  table.hist td:first-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.hist tbody tr { cursor: pointer; }
  table.hist tbody tr:hover { background: var(--chip); }
  table.hist tr.cur { background: var(--tfm-soft); }

  /* Add-ons */
  .addons { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .addon { border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; }
  .addon h4 { margin: 0; font-size: 14px; font-weight: 600; }
  .addon p { margin: 6px 0 0; }
  .addon .aprice { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .addon .aprice small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .addon .afor { color: var(--muted); }

  /* Procedencia */
  .flow { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; counter-reset: step; }
  .flow li { border: 1px solid var(--line-soft); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; color: var(--muted); counter-increment: step; }
  .flow li b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 4px; }
  .flow li b::before { content: counter(step) ". "; color: var(--orange); }
  ul.acct { margin: 0; padding-left: 18px; font-size: 13px; }
  ul.acct li { padding: 4px 0; }
  @media (max-width: 1180px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 860px) { .flow { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <span class="brand">SPHERE</span>
    <nav class="nav-links" aria-label="Secciones"><span>Herramientas</span><b>Colecciones</b><span>Pricings</span><span>Investigación</span></nav>
    <span class="nav-spacer"></span>
    <span class="nav-pill">Boceto · TFM</span>
  </div>
</header>

<main>
  <nav class="crumbs" id="crumbs" aria-label="Ruta"></nav>
  <div class="layout">
    <aside class="tree" aria-label="Clasificación">
      <h2>APIs de correo</h2>
      <p class="lede">Colección de Daniel Vela. Agrupada por tipo de API.</p>
      <ul role="tree" id="tree"></ul>
    </aside>
    <section id="view" aria-live="polite"></section>
  </div>
</main>

<script>
/* ---------- Datos ----------
   Cada API tiene una lista de versiones ordenada por fecha.
   source: "tfm" = foto de la datasheet cerrada; "ext" = reconstruida de una fuente histórica externa.
   Los planes de la foto TFM salen de 03_datos/apis/<api>/datasheet.yaml. */
const APIS = {
  postmark: { name: "Postmark", owner: "ActiveCampaign", url: "postmarkapp.com/pricing", versions: [
    { date: "2019-06-15", source: "ext", note: "Wayback, capturas de 2019-06 a 2022-12. Un solo tramo: 10.000 correos por 10 $ y 1,25 $ cada 1.000 extra.",
      plans: [ { id: "basic", name: "10k", price: 10, quota: [10000, "emails/mes"], over: 1.25, rate: undefined } ] },
    { date: "2023-01-03", source: "ext", note: "Fecha oficial (artículo de soporte de Postmark): el tramo de 10.000 pasa a 15 $ y el exceso a 1,80 $. Los planes antiguos quedan como legacy. El 05-07 retiran los créditos prepago.",
      plans: [ { id: "basic", name: "Basic", price: 15, quota: [10000, "emails/mes"], over: 1.8, rate: undefined } ] },
    { date: "2023-09-15", source: "ext", note: "Wayback, ventana de un mes: aparece el plan gratuito de 100 correos.",
      plans: [
        { id: "free", name: "Free", price: 0, quota: [100, "emails/mes"], over: null, rate: undefined },
        { id: "basic", name: "Basic", price: 15, quota: [10000, "emails/mes"], over: 1.8, rate: undefined } ] },
    { date: "2025-05-15", source: "ext", note: "Wayback. Pro y Platform solo se ofrecen desde volúmenes altos: el precio es el del tramo mínimo de cada uno. Exceso de Pro y Platform no leído.",
      plans: [
        { id: "free", name: "Free", price: 0, quota: [100, "emails/mes"], over: null, rate: undefined },
        { id: "basic", name: "Basic", price: 15, quota: [10000, "emails/mes"], over: 1.8, rate: undefined },

/* ---------- Estado ---------- */
const state = {
  selected: "postmark",
  open: new Set(["root", "api_first", "g_tramos", "g_sinexc", "g_bloques", "g_uso", "partial_saas", "g_tramos_saas"]),
  tab: {}, version: {}, tversion: {}, types: new Set(["quota", "rate", "rep"]),
};

const fmtMoney = v => v === undefined ? "Sin dato" : v === null || typeof v !== "number" ? "A medida" : v === 0 ? "Gratis" : v.toLocaleString("es-ES", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 4 }) + " $";
const fmtNum = v => v.toLocaleString("es-ES");
const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const KIND = { wb: ["ext", "Wayback Machine"], tfm: ["tfm", "Captura del TFM"], live: ["tfm", "Consulta directa"] };
const TYPES = { quota: "Cuotas y peticiones", rate: "Rates", rep: "Reputación y estado de cuenta" };
const PER = { SECOND: "s", MIN: "min", HOUR: "h", DAY: "día", MONTH: "mes", SEC: "s" };
const WIN = { fixed_billing_cycle: "Ciclo de facturación", rolling: "Ventana móvil", fixed_utc_midnight: "Día natural UTC" };
const UNIT = { emails: "correos", requests: "peticiones", MBs: "MB", MiBs: "MiB", email: "correos", request: "peticiones",
  recipient: "destinatarios", domain: "dominios", day: "días", token: "tokens", webhook: "webhooks", route: "rutas",
  template: "plantillas", seat: "puestos", connection: "conexiones", user: "usuarios" };
const LIGHT = { g: "Explícito en la página de precios o en fuente oficial", a: "Inferido", r: "No documentado" };
const lt = l => l ? `<i class="lt ${l}" title="${LIGHT[l]}" aria-label="${LIGHT[l]}"></i>` : "";
const perStr = p => !p || !p.length ? "" : p[0] === 1 ? `/${PER[p[1]] || p[1]}` : ` cada ${p[0]} ${PER[p[1]] || p[1]}`;
const qtyStr = (v, u, p) => v == null ? "A medida" : `${typeof v === "number" ? fmtNum(v) : esc(v)} ${UNIT[u] || u || ""}${perStr(p)}`;
const planName = k => (k.charAt(0).toUpperCase() + k.slice(1)).replace(/_/g, " ");
const camel = k => { const s = k.replace(/([A-Z])/g, " $1").toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); };

function nodeObj(n) { return typeof n === "string" ? { id: n, label: APIS[n].name, leaf: true } : n; }
function leavesOf(n) {
  n = nodeObj(n);
  if (n.leaf || n.pending) return [n];
  return (n.children || []).flatMap(leavesOf);
}
function findPath(id, list = TREE, path = []) {
  for (const raw of list) {
    const n = nodeObj(raw);
    if (n.id === id) return [...path, n];
    if (n.children) { const p = findPath(id, n.children, [...path, n]); if (p) return p; }
  }
  return null;
}

/* ---------- Términos de consumo: versiones ----------
   Resend y MailerSend tienen historial (TERMS). Las demás, solo la foto de su Datasheet. */
function dsOverage(q) {
  if (!q.over) return null;
  const [price, per] = q.over;
  if (typeof price !== "number") return "A medida";
  return per === 1 ? `${fmtMoney(+(price * 1000).toFixed(4))} por 1.000 ${UNIT[q.unit] || q.unit}` : `${fmtMoney(price)} por ${fmtNum(per)} ${UNIT[q.unit] || q.unit}`;
}
function usersOf(id, kind, key) {
  const d = DS[id], plans = [], scopes = new Set();
  for (const [pk, p] of Object.entries(d.plans)) {
    let hit = false;
    if (p[kind] === key) { hit = true; scopes.add("Toda la API"); }
    for (const [ep, e] of Object.entries(p.endpoints)) if (e[kind] === key) { hit = true; scopes.add(ep); }
    if (hit) plans.push(planName(pk));
  }
  return { plans, scopes: [...scopes] };
}
function dsSnapshot(id) {
  const d = DS[id];
  const rates = Object.entries(d.rates).map(([k, r]) => {
    const u = usersOf(id, "rate", k);
    return [(u.scopes.join(" · ") || k) + (u.plans.length && u.plans.length < Object.keys(d.plans).length ? ` (${u.plans.join(", ")})` : ""), qtyStr(r.value, r.unit, r.period), r.l];
  });
  const quota = Object.entries(d.quotas).map(([k, q]) => {
    const u = usersOf(id, "quota", k);
    return [u.plans.join(", ") || k, qtyStr(q.value, q.unit, q.period) + (q.window ? ` · ${WIN[q.window]}` : " · reinicio no publicado"), q.l];
  });
  const overage = Object.entries(d.quotas).filter(([, q]) => q.over).map(([k, q]) => [usersOf(id, "quota", k).plans.join(", ") || k, dsOverage(q), q.overL]);
  return { date: d.date, kind: "tfm", ref: `03_datos/apis/${id}/datasheet.yaml`, integ: null, url: null, built: true, fromDS: true,
    rates, quota, overage: overage.length ? overage : null, acct: null };
}
const termsVersions = id => TERMS[id] ? TERMS[id].versions : [dsSnapshot(id)];

/* ---------- Árbol ---------- */
function renderTree() {
  const build = (list, level) => list.map(raw => {
    const n = nodeObj(raw);
    const isLeaf = n.leaf || n.pending;
    const sel = state.selected === n.id;
    if (isLeaf) {
      return `<li role="none"><button class="node leaf${n.pending ? " pending" : ""}" role="treeitem" aria-level="${level}"
        aria-selected="${sel}" data-id="${n.id}"><span class="chev"></span><span class="dot"></span>${esc(n.label)}
        ${n.leaf ? `<span class="count" title="Versiones de pricing · de términos de consumo">${APIS[n.id].versions.length} · ${termsVersions(n.id).length}</span>` : ""}</button></li>`;
    }
    const open = state.open.has(n.id);
    const total = leavesOf(n).filter(l => !l.pending).length;
    return `<li role="none"><button class="node" role="treeitem" aria-level="${level}" aria-expanded="${open}"
      aria-selected="${sel}" data-id="${n.id}"><span class="chev" aria-hidden="true">▶</span>${esc(n.label)}
      ${n.kind ? `<span class="kind">${n.kind}</span>` : ""}<span class="count">${total || leavesOf(n).length}</span></button>
      ${open ? `<ul role="group">${build(n.children, level + 1)}</ul>` : ""}</li>`;
  }).join("");
  document.getElementById("tree").innerHTML = build(TREE, 1);
}

document.getElementById("tree").addEventListener("click", e => {
  const b = e.target.closest(".node"); if (!b) return;
  const id = b.dataset.id;
  // Primer clic en un grupo: lo abre y lo selecciona. Clic sobre el ya seleccionado: lo pliega o despliega.
  if (b.hasAttribute("aria-expanded")) {
    if (state.selected !== id) state.open.add(id);
    else if (state.open.has(id)) state.open.delete(id);
    else state.open.add(id);
  }
  state.selected = id;
  render();
  document.querySelector(`.node[data-id="${id}"]`)?.focus();
});

/* ---------- Ruta ---------- */
function renderCrumbs() {
  const path = findPath(state.selected) || [];
  const parts = [`<button data-id="root">Colecciones</button>`].concat(path.map((n, i) =>
    i === path.length - 1 ? `<span aria-current="page">${esc(n.label)}</span>` : `<button data-id="${n.id}">${esc(n.label)}</button>`));
  document.getElementById("crumbs").innerHTML = parts.join("<span aria-hidden='true'>/</span>");
}
document.getElementById("crumbs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (b) { state.selected = b.dataset.id; render(); }
});

/* ---------- Vista de grupo ---------- */
function renderGroup(n) {
  const leaves = leavesOf(n);
  const cards = leaves.map(l => {
    if (l.pending) return `<div class="card pending"><div class="who"><span class="badge">TFM</span>Reserva</div>
      <h3>${esc(l.label)}</h3><div class="meta"><span>Sin datasheet</span></div></div>`;
    const a = APIS[l.id], v = a.versions, t = termsVersions(l.id);
    const prices = v[v.length - 1].plans.map(p => p.price).filter(p => p != null);
    return `<button class="card" data-id="${l.id}"><div class="who"><span class="badge">TFM</span>${esc(a.owner)}</div>
      <h3>${esc(a.name)}</h3><div class="meta"><span>${v[v.length - 1].plans.length} planes</span>
      <span>${fmtMoney(Math.min(...prices))}–${fmtMoney(Math.max(...prices))}</span>
      <span>Pricing: ${v.length} ${v.length === 1 ? "versión" : "versiones"}</span>
      <span>Términos: ${t.length} ${t.length === 1 ? "versión" : "versiones"}</span></div></button>`;
  }).join("");
  const ready = leaves.filter(l => !l.pending).length;
  return `<div class="title-row"><div><h1>${esc(n.label)}</h1>
    <p class="sub">${ready} ${ready === 1 ? "API con datasheet" : "APIs con datasheet"}${leaves.length > ready ? ` y ${leaves.length - ready} en reserva` : ""}. Elige una para ver cómo cambiaron su pricing y sus términos de consumo.</p></div></div>
    <div class="grid">${cards}</div>`;
}
document.getElementById("view").addEventListener("click", e => {
  const c = e.target.closest("button.card"); if (c) { state.selected = c.dataset.id; render(); return; }
  const tab = e.target.closest("[role=tab]"); if (tab) { state.tab[state.selected] = tab.dataset.tab; render(); document.querySelector(`[role=tab][data-tab="${tab.dataset.tab}"]`)?.focus(); return; }
  const f = e.target.closest(".fchip"); if (f) { const t = f.dataset.type; state.types.has(t) ? state.types.delete(t) : state.types.add(t); render(); document.querySelector(`.fchip[data-type="${t}"]`)?.focus(); return; }
  const h = e.target.closest("tr[data-to]"); if (h) { state.tversion[state.selected] = +h.dataset.to; render(); document.getElementById("tl-t")?.scrollIntoView({ block: "nearest" }); }
});
document.getElementById("view").addEventListener("keydown", e => {
  const tab = e.target.closest("[role=tab]");
  if (tab && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    e.preventDefault();
    const next = tab.dataset.tab === "pricing" ? "terms" : "pricing";
    state.tab[state.selected] = next; render(); document.querySelector(`[role=tab][data-tab="${next}"]`)?.focus();
  }
  const h = e.target.closest("tr[data-to]");
  if (h && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); h.click(); }
});

/* ---------- Vista de hoja ---------- */
function renderLeaf(id) {
  const a = APIS[id];
  const vs = a.versions, tv = termsVersions(id);
  const latest = vs[vs.length - 1];
  const prices = latest.plans.map(p => p.price).filter(p => p != null);
  const tab = state.tab[id] || "pricing";
  const changes = TERMS[id] ? TERMS[id].changes.length : 0;

  return `<div class="title-row"><div><h1>${esc(a.name)}</h1>
      <p class="sub">${esc(a.owner)} · <a href="https://${a.url}" style="color:inherit">${esc(a.url)}</a></p></div>
      <button class="btn" type="button">Descargar datasheet</button></div>
    <div class="stats">
      <div class="stat"><span>Planes vigentes</span><strong>${latest.plans.length}</strong></div>
      <div class="stat"><span>Precio publicado</span><strong>${fmtMoney(Math.min(...prices))} – ${fmtMoney(Math.max(...prices))}</strong></div>
      <div class="stat"><span>Versiones de pricing</span><strong>${vs.length}</strong></div>
      <div class="stat"><span>Versiones de términos</span><strong>${tv.length}${changes ? ` <small>· ${changes} cambios</small>` : ""}</strong></div>
    </div>
    <div class="tabs" role="tablist" aria-label="Partes de la API">
      <button role="tab" id="tab-pricing" data-tab="pricing" aria-selected="${tab === "pricing"}" aria-controls="panel" tabindex="${tab === "pricing" ? 0 : -1}">Pricing</button>
      <button role="tab" id="tab-terms" data-tab="terms" aria-selected="${tab === "terms"}" aria-controls="panel" tabindex="${tab === "terms" ? 0 : -1}">Términos de consumo</button>
    </div>
    <div id="panel" role="tabpanel" aria-labelledby="tab-${tab}">${tab === "pricing" ? renderPricing(id) : renderTerms(id)}</div>`;
}

/* ---------- Pestaña Pricing ---------- */
function renderPricing(id) {
  const vs = APIS[id].versions;
  const idx = state.version[id] ?? vs.length - 1;
  const v = vs[idx], prev = idx > 0 ? vs[idx - 1] : null;
  return `<section class="timeline" aria-labelledby="tl-p">
      <div class="tl-head"><h2 id="tl-p">Consultando</h2>
        <span class="tl-date">${fmtDate(v.date)}</span>
        <span class="src ${v.source}">${v.source === "tfm" ? "Observado por el TFM" : "Fuente histórica externa"}</span>
        <span class="src truth">Fuente de verdad: página de precios</span></div>
      <p class="tl-note">${esc(v.note)}</p>
      ${vs.length > 1 ? railHTML("p", vs.map(x => ({ date: x.date, cls: x.source })), idx, ["Observado por el TFM", "Fuente histórica externa"]) : `<p class="single">Solo hay una foto del pricing de esta API: la de su Datasheet. Las versiones anteriores se añaden cuando haya una fuente fechada que las sostenga.</p>`}
    </section>
    <section class="block" aria-labelledby="h-plans"><h3 id="h-plans">Planes en esa fecha</h3>
      <p class="sub">Lo que se puede seguir en el tiempo: precio, cuota incluida, exceso y rate.</p>
      <div class="scroll">${plansHTML(v, prev)}</div></section>
    ${dsPricingHTML(id)}
    ${P2Y[id] ? p2yHTML(id) : `<p class="single">Esta API aún no tiene Pricing2YAML para SPHERE, así que no hay features ni add-ons por plan.</p>`}`;
}

function cellMoney(v) { return v === null ? `<span class="pill none">A medida</span>` : `<span class="pill">${fmtMoney(v)}</span>`; }
function cellQty(q) { return q === undefined ? `<span class="pill none">Sin dato</span>` : q ? `<span class="pill">${fmtNum(q[0])} ${esc(q[1])}</span>` : `<span class="pill none">No publicado</span>`; }
function cellOver(o) { return o === undefined ? `<span class="pill none">Sin dato</span>` : o === null ? `<span class="pill none">No aplica</span>` : `<span class="pill">${fmtMoney(o)}</span>`; }
const GRADS = ["--plan-1", "--plan-2", "--plan-3", "--plan-4", "--plan-5"];

function plansHTML(v, prev) {
  const prevById = prev ? Object.fromEntries(prev.plans.map(p => [p.id, p])) : {};
  const head = v.plans.map((p, i) => {
    const before = prevById[p.id];
    const priceChanged = prev && before && before.price !== undefined && p.price !== undefined && before.price !== p.price;
    return `<th class="plan" scope="col" style="background:var(${GRADS[i % 5]})"><span class="pname">${esc(p.name)}</span>
      <span class="pprice">${fmtMoney(p.price)}</span><span class="pper">${p.price ? "al mes" : "&nbsp;"}</span>
      ${priceChanged ? `<span class="pper" style="text-decoration:line-through;opacity:.75">antes ${fmtMoney(before.price)}</span>` : ""}
      ${prev && !before ? `<span class="pper">nuevo</span>` : ""}</th>`;
  }).join("");
  const row = (label, help, key, fmt, prevFmt) => `<tr><th scope="row">${label}<small>${help}</small></th>${v.plans.map(p => {
    const before = prevById[p.id];
    const a = String(JSON.stringify(p[key])), b = before ? String(JSON.stringify(before[key])) : a;
    const changed = prev && before && before[key] !== undefined && p[key] !== undefined && a !== b;
    return `<td class="${changed ? "changed" : ""}">${fmt(p[key])}${changed ? `<span class="was">antes ${prevFmt(before[key])}</span>` : ""}</td>`;
  }).join("")}</tr>`;
  const plain = q => q === undefined ? "sin dato" : q ? `${fmtNum(q[0])} ${q[1]}` : "no publicado";
  const removed = prev ? prev.plans.filter(p => !v.plans.some(q => q.id === p.id)) : [];
  return `<table><thead><tr><th></th>${head}</tr></thead><tbody>
      ${row("Cuota incluida", "Volumen que entra en el precio", "quota", cellQty, plain)}
      ${row("Coste por exceso", "Por cada 1.000 correos", "over", cellOver, o => o === undefined ? "sin dato" : o === null ? "no aplica" : fmtMoney(o))}
      ${row("Rate", "Límite de caudal", "rate", cellQty, plain)}
    </tbody></table>
    ${removed.length ? `<p class="plans-foot">Desaparecen en esta versión: ${removed.map(p => esc(p.name)).join(", ")}.</p>` : ""}
    <p class="plans-foot">Los valores marcados con «antes» cambiaron respecto a la versión anterior.</p>`;
}

/* Detalle por plan desde la Datasheet: periodo, ventana, exceso, rates y límites por endpoint, con semáforo */
function dsPricingHTML(id) {
  const d = DS[id], plans = Object.entries(d.plans);
  const scoped = (p, kind, pool) => {
    const out = [];
    if (p[kind]) out.push([p[kind], "toda la API"]);
    for (const [ep, e] of Object.entries(p.endpoints)) if (e[kind] && !out.some(([k]) => k === e[kind])) out.push([e[kind], ep]);
    return out.map(([k, where]) => { const x = pool[k]; return `<span class="line">${qtyStr(x.value, x.unit, x.period)} ${lt(x.l)}<small>${esc(where)}</small></span>`; }).join("") || `<span class="none">No publicado</span>`;
  };
  const quotasOf = p => [p.quota, ...Object.values(p.endpoints).map(e => e.quota)].filter(Boolean).filter((k, i, a) => a.indexOf(k) === i).map(k => d.quotas[k]);
  const head = plans.map(([k, p], i) => `<th class="plan" scope="col" style="background:var(${GRADS[i % 5]})"><span class="pname">${esc(planName(k))}</span>
      <span class="pprice">${typeof p.price === "number" ? fmtMoney(p.price) : "A medida"}</span><span class="pper">${p.period ? `cada ${p.period[0] === 1 ? "" : p.period[0] + " "}${PER[p.period[1]] || p.period[1]}` : "&nbsp;"}</span></th>`).join("");
  const row = (label, help, f) => `<tr><th scope="row">${label}<small>${help}</small></th>${plans.map(([, p]) => `<td class="left">${f(p)}</td>`).join("")}</tr>`;
  const nEp = p => Object.values(p.endpoints).filter(e => e.quota || e.rate || e.workload.length).length;
  return `<section class="block" aria-labelledby="h-ds"><h3 id="h-ds">Detalle por plan</h3>
    <p class="sub">Datasheet del ${fmtDate(d.date)}: ${d.sources} fuentes visitadas, ${d.prov.panel} observaciones de panel y ${d.prov.probe} sondeos. Cada cifra lleva su semáforo. Si una fuente contradice la página de precios, gana la página y la discrepancia se registra.</p>
    <div class="scroll"><table class="detail"><thead><tr><th></th>${head}</tr></thead><tbody>
      ${row("Precio", "Semáforo del precio", p => `${typeof p.price === "number" ? fmtMoney(p.price) : "A medida"} ${lt(p.priceL)}`)}
      ${row("Cuotas", "Valor, unidad y periodo", p => scoped(p, "quota", d.quotas))}
      ${row("Ventana de reinicio", "Cuándo vuelve a cero", p => quotasOf(p).map(q => `<span class="line">${q.window ? WIN[q.window] : `<span class="none">No publicada</span>`}</span>`).join("") || `<span class="none">—</span>`)}
      ${row("Exceso", "Precio al pasar la cuota", p => quotasOf(p).map(q => q.over ? `<span class="line">${dsOverage(q)} ${lt(q.overL)}</span>` : `<span class="line none">Sin exceso: tope duro</span>`).join("") || `<span class="none">—</span>`)}
      ${row("Rates", "Caudal y ámbito", p => scoped(p, "rate", d.rates))}
      ${row("Operaciones con límite", "Endpoints con cuota, rate o carga máxima", p => `${nEp(p)} endpoints`)}
    </tbody></table></div>
    <p class="plans-foot"><i class="lt g"></i> explícito en la página de precios o en fuente oficial · <i class="lt a"></i> inferido · <i class="lt r"></i> no documentado</p></section>`;
}

/* Features, límites de uso y add-ons del Pricing2YAML que lee SPHERE */
function p2yHTML(id) {
  const y = P2Y[id], plans = Object.entries(y.plans);
  const head = plans.map(([k, p], i) => `<th class="plan" scope="col" style="background:var(${GRADS[i % 5]})"><span class="pname">${esc(planName(k))}</span><span class="pprice">${fmtMoney(p.price)}</span></th>`).join("");
  const fval = (p, k) => (k in p.f ? p.f[k] : y.features[k].def) ? `<span class="yes" aria-label="Incluida">✓</span>` : `<span class="none" aria-label="No incluida">—</span>`;
  const lval = (p, k) => {
    const L = y.limits[k], v = k in p.l ? p.l[k] : L.def;
    if (v >= 1e8) return `<span class="pill">Sin límite</span>`;
    return `<span class="pill">${fmtNum(v)} ${UNIT[L.u] || L.u || ""}${L.p ? "/" + (PER[L.p] || L.p) : ""}</span>`;
  };
  const byTag = {};
  for (const [k, f] of Object.entries(y.features)) (byTag[f.tag || "Otras"] ||= []).push(k);
  const fRows = Object.entries(byTag).map(([tag, ks]) => `<tr class="group"><th colspan="${plans.length + 1}">${esc(tag)}</th></tr>` +
    ks.map(k => `<tr><th scope="row">${esc(camel(k))}<small>${esc(y.features[k].d)}</small></th>${plans.map(([, p]) => `<td>${fval(p, k)}</td>`).join("")}</tr>`).join("")).join("");
  const lRows = Object.keys(y.limits).map(k => `<tr><th scope="row">${esc(camel(k))}<small>${esc(y.limits[k].d)}</small></th>${plans.map(([, p]) => `<td>${lval(p, k)}</td>`).join("")}</tr>`).join("");
  const addons = Object.entries(y.addOns).map(([k, a]) => `<div class="addon"><h4>${esc(camel(k))}</h4>
      <p class="aprice">${fmtMoney(a.price)} <small>por ${esc(a.u)}</small></p><p>${esc(a.d)}</p>
      <p class="afor">Para ${a.for.map(planName).join(", ")}</p></div>`).join("");
  return `<section class="block" aria-labelledby="h-p2y"><h3 id="h-p2y">Features, límites de uso y add-ons</h3>
    <p class="sub">Pricing2YAML del ${fmtDate(y.version)}, el que se sube a SPHERE. Las limitaciones del formato están en no_admite.md.</p>
    <div class="scroll"><table><thead><tr><th></th>${head}</tr></thead><tbody>
      <tr class="group"><th colspan="${plans.length + 1}">Features</th></tr>${fRows}
      <tr class="group"><th colspan="${plans.length + 1}">Límites de uso</th></tr>${lRows}
    </tbody></table></div>
    <h4 class="h4">Add-ons</h4><div class="addons">${addons}</div></section>`;
}

/* ---------- Pestaña Términos de consumo ---------- */
function kvTable(rows, empty) {
  if (!rows || !rows.length) return `<p class="none small">${empty}</p>`;
  return `<table class="kv"><tbody>${rows.map(r => `<tr><th scope="row">${esc(r[0])}</th><td>${esc(r[1])} ${lt(r[2])}</td></tr>`).join("")}</tbody></table>`;
}
function renderTerms(id) {
  const T = TERMS[id], vs = termsVersions(id);
  const idx = Math.min(state.tversion[id] ?? vs.length - 1, vs.length - 1);
  const v = vs[idx];
  const [cls, kindLabel] = KIND[v.kind];
  const ch = T ? T.changes.filter(c => state.types.has(c.type)) : [];
  const here = ch.filter(c => c.to === idx);
  const counts = T ? Object.fromEntries(Object.keys(TYPES).map(t => [t, T.changes.filter(c => c.type === t).length])) : {};
  const acct = v.acct ? v.acct.map(a => [a]) : null;
  const sourceLine = v.fromDS
    ? `Foto de la Datasheet · <code>${esc(v.ref)}</code>`
    : `${v.url ? `<a href="${esc(v.url)}">${esc(v.ref)}</a>` : `<code>${esc(v.ref)}</code>`}${v.integ ? ` · <span title="Huella del contenido capturado">${esc(v.integ)}</span>` : ""}${v.built ? " · base de la Datasheet" : ""}`;

  return `<section class="timeline" aria-labelledby="tl-t">
      <div class="tl-head"><h2 id="tl-t">Consultando</h2>
        <span class="tl-date">${fmtDate(v.date)}</span>
        <span class="src ${cls}">${kindLabel}</span></div>
      <p class="tl-note">${T ? `Página seguida: ${esc(T.page)}. Apartados: ${esc(T.sections)}.` : ""} ${sourceLine}</p>
      ${v.also ? `<p class="tl-note">${esc(v.also)}</p>` : ""}
      ${vs.length > 1 ? railHTML("t", vs.map(x => ({ date: x.date, cls: KIND[x.kind][0] })), idx, ["Captura del TFM o consulta directa", "Wayback Machine"])
        : `<p class="single">Solo hay una versión: la foto de la Datasheet. El historial de esta API aún no se ha reconstruido.</p>`}
    </section>
    ${T ? `<div class="filters" role="group" aria-label="Filtrar cambios por tipo">${Object.entries(TYPES).map(([t, label]) =>
      `<button class="fchip ${t}" data-type="${t}" aria-pressed="${state.types.has(t)}">${label} <span>${counts[t]}</span></button>`).join("")}</div>` : ""}
    <div class="cols">
      <section class="block" aria-labelledby="h-now"><h3 id="h-now">Términos en esa fecha</h3>
        <h4 class="h4">Rates</h4>${kvTable(v.rates, "No publicados en esta versión.")}
        <h4 class="h4">Cuotas y peticiones</h4>${kvTable(v.quota, "No publicadas en esta versión.")}
        <h4 class="h4">Exceso</h4>${kvTable(v.overage, "No hay exceso publicado en esta versión.")}
        <h4 class="h4">Cuenta, suscripción y reputación</h4>${acct ? `<ul class="acct">${v.acct.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : `<p class="none small">La Datasheet no lo separa. Va aparte desde la reunión del 15 de octubre.</p>`}
      </section>
      <section class="block" aria-labelledby="h-diff"><h3 id="h-diff">${idx === 0 ? "Primera versión" : "Qué cambió"}</h3>
        <p class="sub">${!T ? "Sin versión anterior con la que comparar." : idx === 0 ? "Es la versión más antigua que se ha podido leer." : `Respecto al ${fmtDate(vs[idx - 1].date)}.`}</p>
        ${here.map(c => `<article class="diff ${c.type}"><header><span class="tchip ${c.type}">${TYPES[c.type]}</span><b>${esc(c.sec)}</b></header>
          ${c.before ? `<p class="before"><span>Antes</span>${esc(c.before)}</p>` : `<p class="before"><span>Antes</span><em>No existía</em></p>`}
          <p class="after"><span>Después</span>${esc(c.after)}</p><p class="why">${esc(c.why)}</p></article>`).join("")
          || (T && idx > 0 ? `<p class="none small">${T.changes.some(c => c.to === idx) ? "Los cambios de esta versión están ocultos por el filtro." : "Ninguno en el texto de consumo."}</p>` : "")}
      </section>
    </div>
    ${T ? `<section class="block" aria-labelledby="h-hist"><h3 id="h-hist">Historial de cambios</h3>
      <p class="sub">${ch.length} de ${T.changes.length} cambios en ${vs.length} versiones desde el ${fmtDate(vs[0].date)}. Pulsa una fila para ir a su versión.</p>
      <div class="scroll"><table class="hist"><thead><tr><th>Versión</th><th>Tipo</th><th>Apartado</th><th>Antes</th><th>Después</th></tr></thead><tbody>
      ${ch.map(c => `<tr data-to="${c.to}" tabindex="0" class="${c.to === idx ? "cur" : ""}"><td>${fmtDate(vs[c.to].date)}</td><td><span class="tchip ${c.type}">${TYPES[c.type]}</span></td>
        <td>${esc(c.sec)}</td><td>${c.before ? esc(c.before) : "—"}</td><td>${esc(c.after)}</td></tr>`).join("")}
      </tbody></table></div></section>` : ""}
    ${workloadHTML(id)}
    <section class="block" aria-labelledby="h-prov"><h3 id="h-prov">De dónde sale</h3>
      <ol class="flow">
        <li><b>Fuente</b>Página de precios (fuente de verdad) + ${DS[id].sources - 1} fuentes de apoyo${T ? `. Términos de consumo: ${esc(T.page)}` : ""}</li>
        <li><b>Capturas</b>${T ? "Wayback Machine, la captura del TFM y una consulta directa, cada una con su huella" : "Captura del TFM, base de la Datasheet"}</li>
        <li><b>Extracción</b>Solo los apartados de consumo. Cifras y paráfrasis cortas, nunca la página</li>
        <li><b>Comparación</b>Una versión cuenta si cambió ese texto. Cada cambio se tipa: cuotas, rates o reputación</li>
      </ol>
      <p class="plans-foot">La Datasheet registra además ${DS[id].not_found.length} cosas que el proveedor no publica.</p></section>`;
}

const wMax = (m, u) => m == null ? "Sin tope publicado" : `${fmtNum(m)} ${UNIT[u] || u}`;
/* Carga máxima por operación, de la Datasheet. Si todos los planes coinciden, una sola cifra. */
function workloadHTML(id) {
  const d = DS[id], rows = new Map();
  for (const [pk, p] of Object.entries(d.plans)) for (const [ep, e] of Object.entries(p.endpoints)) for (const w of e.workload) {
    const key = ep + "|" + w.unit;
    if (!rows.has(key)) rows.set(key, { ep, unit: w.unit, desc: w.desc, by: {} });
    rows.get(key).by[pk] = w;
  }
  const meaningful = [...rows.values()].filter(r => Object.values(r.by).some(w => w.max !== 1 || r.unit !== "requests"));
  if (!meaningful.length) return "";
  const nPlans = Object.keys(d.plans).length;
  const cell = r => {
    const vals = Object.entries(r.by), same = vals.every(([, w]) => w.max === vals[0][1].max);
    if (same) return `${wMax(vals[0][1].max, r.unit)} ${lt(vals[0][1].l)}${vals.length < nPlans ? `<small>${vals.map(([k]) => planName(k)).join(", ")}</small>` : `<small>todos los planes</small>`}`;
    return vals.map(([k, w]) => `<span class="line">${planName(k)}: ${wMax(w.max, r.unit)} ${lt(w.l)}</span>`).join("");
  };
  return `<section class="block" aria-labelledby="h-wl"><h3 id="h-wl">Límites por operación</h3>
    <p class="sub">Carga máxima que acepta cada endpoint en una petición, según la Datasheet del ${fmtDate(d.date)}.</p>
    <div class="scroll"><table class="kv wl"><thead><tr><th>Endpoint</th><th>Máximo</th><th>Qué mide</th></tr></thead><tbody>
    ${meaningful.map(r => `<tr><th scope="row"><code>${esc(r.ep)}</code></th><td>${cell(r)}</td><td class="desc">${esc(r.desc || "")}</td></tr>`).join("")}
    </tbody></table></div></section>`;
}

/* ---------- Timeline deslizable (sirve a las dos pestañas) ---------- */
function timePos(vs) {
  const t = vs.map(v => +new Date(v.date));
  const min = Math.min(...t), max = Math.max(...t);
  return t.map(x => max === min ? 50 : ((x - min) / (max - min)) * 100);
}

function railHTML(rid, vs, idx, legend) {
  const pos = timePos(vs);
  // Se rotulan siempre la primera, la última y la consultada; las demás solo si no pisan a otra.
  const shown = new Set([0, vs.length - 1, idx]);
  pos.forEach((p, i) => { if (![...shown].some(j => Math.abs(pos[j] - p) < 20)) shown.add(i); });
  const stops = vs.map((v, i) => {
    const edge = pos[i] < 6 ? " edge-l" : pos[i] > 94 ? " edge-r" : "";
    return `<button class="stop ${v.cls}${i <= idx ? " past" : ""}" style="left:${pos[i]}%" data-i="${i}" tabindex="-1"
      aria-label="Ver la versión del ${fmtDate(v.date)}"></button>
      <span class="stop-label${edge}"${shown.has(i) ? "" : " hidden"} style="left:${pos[i]}%">${new Date(v.date + "T00:00:00").toLocaleDateString("es-ES", { month: "short", year: "numeric" })}</span>`;
  }).join("");
  return `<div class="rail" id="rail-${rid}">
      <div class="base"></div><div class="fill" style="width:${pos[idx]}%"></div>
      ${stops}
      <div class="marker" role="slider" tabindex="0" aria-label="Fecha consultada"
        aria-valuemin="0" aria-valuemax="${vs.length - 1}" aria-valuenow="${idx}" aria-valuetext="${fmtDate(vs[idx].date)}"
        style="left:${pos[idx]}%"><span class="tip">${fmtDate(vs[idx].date)}</span></div>
    </div>
    <div class="legend"><span><i></i>${legend[0]}</span><span><i class="ext"></i>${legend[1]}</span>
      <span>Arrastra el marcador o usa las flechas</span></div>`;
}

function bindRail(rid, vs, slot) {
  const rail = document.getElementById("rail-" + rid); if (!rail) return;
  const marker = rail.querySelector(".marker"), fill = rail.querySelector(".fill"), tip = rail.querySelector(".tip");
  const id = state.selected, pos = timePos(vs);
  const nearest = pct => pos.reduce((best, p, i) => Math.abs(p - pct) < Math.abs(pos[best] - pct) ? i : best, 0);
  const pctFrom = x => { const r = rail.getBoundingClientRect(); return Math.min(100, Math.max(0, ((x - r.left) / r.width) * 100)); };
  const commit = i => { state[slot][id] = i; render(); document.querySelector(`#rail-${rid} .marker`)?.focus({ preventScroll: true }); };
  // El arrastre escucha en la ventana: así el marcador se suelta bien aunque el puntero salga de la pista.
  let lastPct = null, justDragged = false;
  const move = e => {
    lastPct = pctFrom(e.clientX);
    marker.style.left = lastPct + "%"; fill.style.width = lastPct + "%";
    tip.textContent = fmtDate(vs[nearest(lastPct)].date);
  };
  const end = e => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", end);
    marker.classList.remove("dragging");
    if (lastPct === null) return;
    const i = nearest(pctFrom(e.clientX ?? 0) ?? lastPct);
    justDragged = true; setTimeout(() => { justDragged = false; }, 0);
    marker.classList.add("animate"); marker.style.left = pos[i] + "%"; fill.style.width = pos[i] + "%";
    setTimeout(() => commit(i), matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 220);
  };
  marker.addEventListener("pointerdown", e => {
    e.preventDefault(); lastPct = null;
    marker.classList.add("dragging"); marker.classList.remove("animate");
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", end);
  });
  rail.addEventListener("click", e => {
    if (justDragged || e.target === marker || marker.contains(e.target)) return;
    const stop = e.target.closest(".stop");
    commit(stop ? +stop.dataset.i : nearest(pctFrom(e.clientX)));
  });
  marker.addEventListener("keydown", e => {
    const cur = state[slot][id] ?? vs.length - 1;
    const next = { ArrowLeft: cur - 1, ArrowDown: cur - 1, ArrowRight: cur + 1, ArrowUp: cur + 1, Home: 0, End: vs.length - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    commit(Math.max(0, Math.min(vs.length - 1, next)));
  });
}

/* ---------- Render ---------- */
function render() {
  renderTree(); renderCrumbs();
  const view = document.getElementById("view");
  const sel = state.selected;
  if (APIS[sel]) {
    view.innerHTML = renderLeaf(sel);
    if ((state.tab[sel] || "pricing") === "pricing") bindRail("p", APIS[sel].versions, "version");
    else bindRail("t", termsVersions(sel), "tversion");
  } else {
    const n = (findPath(sel) || []).pop();
    view.innerHTML = n && !n.pending ? renderGroup(n)
      : `<h1>${esc(n ? n.label : "")}</h1><p class="sub">Esta API está en la reserva del catálogo y aún no tiene datasheet. Cuando se construya, aparecerá aquí con sus dos líneas de versiones.</p>`;
  }
}
render();
</script>
