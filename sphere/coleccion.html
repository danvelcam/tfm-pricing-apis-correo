<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APIs de correo v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  /* Tokens copiados de SPHERE (sphere.score.us.es, frontend/src/modules/core/theme) */
  :root {
    --ink: #1f1f1f;
    --muted: #6a6a6a;
    --line: #b8b8b8;
    --line-soft: #e4e4e4;
    --field: #c7c7c7;
    --chip: #fafafa;
    --page: #ffffff;
    --surface: #ffffff;
    --orange: #fa520f;
    --orange-deep: #cc3a05;
    --navy: #023e8a;
    --ext: #0369a1;
    --ext-soft: #e0f2fe;
    --tfm-soft: #fff1ea;
    --track: linear-gradient(90deg, #fa520f 0%, #ffa110 35%, #ffb83e 55%, #ffd900 75%, #fff8e0 100%);
    --plan-1: linear-gradient(135deg, #fa520f, #cc3a05);
    --plan-2: linear-gradient(135deg, #e68a00, #b36b00);
    --plan-3: linear-gradient(135deg, #14b8a6, #0f766e);
    --plan-4: linear-gradient(135deg, #0ea5e9, #0369a1);
    --plan-5: linear-gradient(135deg, #8b5cf6, #6d28d9);
    --nav-shadow: 0 6px 26px rgba(15, 23, 42, .08);
    --serif: "Instrument Serif", "PP Editorial Old", "Times New Roman", Georgia, serif;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ececec; --muted: #a3a3a3; --line: #4a4a4a; --line-soft: #2e2e2e; --field: #555;
      --chip: #232323; --page: #141414; --surface: #1b1b1b; --ext: #7dd3fc; --ext-soft: #0c2a3d;
      --tfm-soft: #3a1c0e; --nav-shadow: 0 6px 26px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    --ink: #ececec; --muted: #a3a3a3; --line: #4a4a4a; --line-soft: #2e2e2e; --field: #555;
    --chip: #232323; --page: #141414; --surface: #1b1b1b; --ext: #7dd3fc; --ext-soft: #0c2a3d;
    --tfm-soft: #3a1c0e; --nav-shadow: 0 6px 26px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 400 16px/1.5 var(--sans); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 6px; }

  /* Barra de navegación en píldora, como la de SPHERE */
  .nav { position: sticky; top: 12px; z-index: 10; margin: 12px auto 0; max-width: 1180px; padding: 0 16px; }
  .nav-inner { display: flex; align-items: center; gap: 28px; padding: 12px 14px 12px 22px; background: var(--surface);
    border: 1px solid var(--line-soft); border-radius: 9999px; box-shadow: var(--nav-shadow); }
  .brand { font-size: 14px; letter-spacing: 3.08px; font-weight: 500; }
  .nav-links { display: flex; gap: 22px; font-size: 13px; letter-spacing: 1.2px; color: var(--muted); }
  .nav-links b { color: var(--ink); font-weight: 500; }
  .nav-spacer { flex: 1; }
  .nav-pill { border: 1px solid var(--field); border-radius: 9999px; padding: 6px 16px; font-size: 13px; color: var(--muted); }

  main { max-width: 1180px; margin: 0 auto; padding: 28px 16px 64px; }
  .crumbs { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .crumbs button { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; }
  .crumbs button:hover { color: var(--ink); }
  .crumbs [aria-current] { color: var(--ink); }

  .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; margin-top: 12px; }

  /* Árbol de clasificación */
  .tree { position: sticky; top: 92px; align-self: start; border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 10px; background: var(--surface); }
  .tree h2 { font: 400 22px/1.2 var(--serif); margin: 4px 8px 4px; }
  .tree p.lede { font-size: 12px; color: var(--muted); margin: 0 8px 12px; }
  .tree ul { list-style: none; margin: 0; padding: 0; }
  .tree ul ul { padding-left: 14px; border-left: 1px solid var(--line-soft); margin-left: 13px; }
  .node { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: none; border: 0;
    padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
  .node:hover { background: var(--chip); }
  .node .chev { width: 14px; flex: none; color: var(--muted); transition: transform .15s; font-size: 11px; }
  .node[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .node .count { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--chip);
    border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 6px; white-space: nowrap; flex: none; }
  .node.leaf .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); flex: none; margin: 0 3px; }
  .node.leaf.pending { color: var(--muted); }
  .node.leaf.pending .dot { background: transparent; border: 1px dashed var(--line); }
  .node[aria-selected="true"] { background: var(--tfm-soft); font-weight: 500; }
  .node .kind { font-size: 11px; color: var(--muted); font-weight: 400; }

  /* Cabecera de la hoja */
  .title-row { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  h1 { font: 400 40px/1.1 var(--serif); margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: var(--orange); color: #fff; border: 0;
    border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 500; cursor: pointer; margin-left: auto; }
  .btn:hover { background: var(--orange-deep); }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 20px 0 28px; }
  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
  .stat span { display: block; font-size: 11px; color: var(--muted); }
  .stat strong { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* Timeline: la pieza nueva */
  .timeline { border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px 20px; background: var(--surface); }
  .tl-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .tl-head h2 { font: 400 24px/1.2 var(--serif); margin: 0; }
  .tl-date { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .src { font-size: 11px; border-radius: 4px; padding: 2px 8px; }
  .src.tfm { background: var(--tfm-soft); color: var(--orange-deep); }
  .src.ext { background: var(--ext-soft); color: var(--ext); }
  .src.truth { background: var(--chip); color: var(--muted); border: 1px solid var(--line-soft); }
  :root[data-theme="dark"] .src.tfm { color: #ffb48f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .src.tfm { color: #ffb48f; } }
  .tl-note { font-size: 13px; color: var(--muted); margin: 6px 0 0; max-width: 72ch; }

  .rail { position: relative; height: 74px; margin: 18px 10px 0; touch-action: none; user-select: none; cursor: pointer; }
  .rail .base { position: absolute; left: 0; right: 0; top: 22px; height: 6px; border-radius: 9999px; background: var(--line-soft); }
  .rail .fill { position: absolute; left: 0; top: 22px; height: 6px; border-radius: 9999px; background: var(--track);
    background-size: var(--rail-w, 100%) 100%; }
  .stop { position: absolute; top: 25px; transform: translate(-50%, -50%); width: 14px; height: 14px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--line); padding: 0; cursor: pointer; }
  .stop.ext { border-style: dashed; border-color: var(--ext); }
  .stop.tfm { border-color: var(--orange); }
  .stop.past { background: var(--orange); border-color: var(--orange); }
  .stop.ext.past { background: var(--ext); border-color: var(--ext); }
  .stop-label { position: absolute; top: 44px; transform: translateX(-50%); font-size: 11px; color: var(--muted);
    white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; }
  .stop-label.edge-l { transform: none; }
  .stop-label.edge-r { transform: translateX(-100%); }
  .marker { position: absolute; top: 25px; width: 26px; height: 26px; transform: translate(-50%, -50%); border-radius: 50%;
    background: var(--surface); border: 3px solid var(--ink); box-shadow: 0 2px 10px rgba(0,0,0,.18); cursor: grab; z-index: 2; }
  .marker.dragging { cursor: grabbing; }
  .marker.animate { transition: left .25s cubic-bezier(.2, .8, .2, 1); }
  .marker .tip { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page);
    font-size: 11px; padding: 3px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; transition: opacity .12s; pointer-events: none; }
  .marker.dragging .tip, .marker:focus-visible .tip { opacity: 1; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--orange); vertical-align: -1px; margin-right: 6px; }
  .legend i.ext { border: 2px dashed var(--ext); }
  .single { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 16px; }

  /* Tabla de planes, cabeceras en degradado como en SPHERE */
  .plans { margin-top: 24px; border: 1px solid var(--line); border-radius: 16px; padding: 20px; background: var(--surface); overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 560px; }
  th.plan { color: #fff; padding: 14px 10px; text-align: center; vertical-align: top; min-width: 112px; }
  th.plan .pname { display: block; font-size: 17px; font-weight: 700; letter-spacing: .2px; }
  th.plan .pprice { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  th.plan .pper { display: block; font-size: 12px; font-weight: 500; opacity: .9; }
  th.plan:nth-child(2) { border-top-left-radius: 10px; }
  th.plan:last-child { border-top-right-radius: 10px; }
  tbody th { text-align: left; font-size: 14px; font-weight: 600; padding: 14px 12px 14px 0; min-width: 150px; }
  tbody th small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  td { text-align: center; padding: 12px 6px; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .pill { display: inline-block; background: var(--orange); color: #fff; border-radius: 9999px; padding: 3px 12px;
    font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill.none { background: transparent; color: var(--muted); border: 1px dashed var(--line); font-weight: 400; }
  .was { display: block; font-size: 11px; color: var(--muted); text-decoration: line-through; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .changed .pill { box-shadow: 0 0 0 3px var(--tfm-soft); }
  .gone { opacity: .45; }
  .plans-foot { font-size: 12px; color: var(--muted); margin: 14px 0 0; }

  /* Vista de colección (nodo interior seleccionado) */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 20px; }
  .card { text-align: left; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--surface); cursor: pointer; }
  .card:hover { border-color: var(--ink); }
  .card .who { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .badge { width: 20px; height: 20px; border-radius: 6px; background: var(--navy); color: #fff; font-size: 8px; font-weight: 600;
    display: grid; place-items: center; }
  .card h3 { font-size: 14px; font-weight: 500; margin: 10px 0 10px; }
  .card .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .card .meta span { background: var(--chip); border-radius: 4px; padding: 1px 6px; }
  .card.pending { border-style: dashed; cursor: default; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .tree { position: static; }
    .nav-links { display: none; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    h1 { font-size: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .marker.animate, .node .chev { transition: none; }
  }

  /* Pestañas Pricing / Otros términos */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 20px; }
  .tabs [role=tab] { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 16px 9px; font-size: 15px;
    font-weight: 500; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
  .tabs [role=tab]:hover { color: var(--ink); }
  .tabs [role=tab][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--orange); }
  .stat small { font-size: 12px; font-weight: 500; color: var(--muted); }

  .block { margin-top: 24px; border: 1px solid var(--line); border-radius: 16px; padding: 20px; background: var(--surface); min-width: 0; }
  .block h3 { font: 400 24px/1.2 var(--serif); margin: 0; }
  .block .sub { margin: 4px 0 14px; font-size: 13px; }
  .h4 { font-size: 13px; font-weight: 600; margin: 18px 0 6px; }
  .block > .h4:first-of-type { margin-top: 12px; }
  .scroll { overflow-x: auto; }
  .small { font-size: 13px; margin: 0; }
  .none { color: var(--muted); }
  .line { display: block; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .line small, td small { display: block; color: var(--muted); font-size: 11px; }
  td.left { text-align: left; vertical-align: top; }
  table.detail td { min-width: 150px; }
  tr.group th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 18px 0 6px; border-bottom: 1px solid var(--line); }
  .yes { color: var(--orange-deep); font-weight: 700; }
  code { font-size: 12px; background: var(--chip); border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }

  /* Semáforo de la Datasheet */
  .lt { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: 1px; margin-left: 4px; }
  .lt.g { background: #16a34a; } .lt.a { background: #eab308; } .lt.r { background: #dc2626; }

  /* Tablas clave-valor de los términos */
  table.kv { min-width: 0; }
  table.kv th { text-align: left; font-size: 13px; font-weight: 500; padding: 7px 12px 7px 0; vertical-align: top; width: 42%; border-bottom: 1px solid var(--line-soft); }
  table.kv td { text-align: left; padding: 7px 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  table.wl th { width: auto; }
  table.wl thead th, table.hist thead th { font-size: 12px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); text-align: left; padding: 6px 8px 6px 0; }
  table.wl td.desc { color: var(--muted); font-size: 12px; max-width: 46ch; padding-left: 12px; }
  table.wl td { min-width: 130px; }

  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .cols .block { margin-top: 20px; }

  /* Filtros por tipo de cambio */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .fchip { border: 1px solid var(--field); background: var(--surface); border-radius: 9999px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .fchip span { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 2px; }
  .fchip[aria-pressed="true"] { border-color: var(--ink); background: var(--chip); }
  .fchip[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
  .fchip::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; background: var(--c); }
  .quota { --c: #fa520f; } .rate { --c: #0369a1; } .rep { --c: #8b5cf6; }
  .tchip { display: inline-block; font-size: 11px; border-radius: 4px; padding: 1px 6px; white-space: nowrap;
    color: var(--c); border: 1px solid var(--c); }

  /* Diff de una versión */
  .diff { border-left: 3px solid var(--c); padding: 8px 0 8px 14px; margin-top: 12px; }
  .diff header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .diff p { margin: 6px 0 0; font-size: 13px; }
  .diff p span { display: inline-block; min-width: 64px; font-size: 11px; color: var(--muted); }
  .diff .before { color: var(--muted); }
  .diff .why { font-size: 12px; color: var(--muted); font-style: italic; }

  table.hist { min-width: 720px; }
  table.hist td { text-align: left; vertical-align: top; font-size: 12.5px; padding: 8px 8px 8px 0; }
  table.hist td:first-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.hist tbody tr { cursor: pointer; }
  table.hist tbody tr:hover { background: var(--chip); }
  table.hist tr.cur { background: var(--tfm-soft); }

  /* Add-ons */
  .addons { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .addon { border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; }
  .addon h4 { margin: 0; font-size: 14px; font-weight: 600; }
  .addon p { margin: 6px 0 0; }
  .addon .aprice { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .addon .aprice small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .addon .afor { color: var(--muted); }

  /* Procedencia */
  .flow { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; counter-reset: step; }
  .flow li { border: 1px solid var(--line-soft); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; color: var(--muted); counter-increment: step; }
  .flow li b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 4px; }
  .flow li b::before { content: counter(step) ". "; color: var(--orange); }
  ul.acct { margin: 0; padding-left: 18px; font-size: 13px; }
  ul.acct li { padding: 4px 0; }
  @media (max-width: 1180px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 860px) { .flow { grid-template-columns: minmax(0, 1fr); } }

  /* Enlaces entre páginas del boceto */
  a.xl { color: var(--ext); text-decoration: underline; text-underline-offset: 2px; }
  a.xl:hover { color: var(--ink); }
  a.btn { text-decoration: none; color: #fff; }

  /* Planes como tarjetas, con la estructura del proveedor */
  .pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; align-items: start; }
  .pcard { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); min-width: 0; }
  .pcard > header { color: #fff; padding: 14px 14px 12px; }
  .pcard .pname { display: block; font-size: 17px; font-weight: 700; }
  .pcard .pprice { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pcard .pper { display: block; font-size: 12px; font-weight: 500; opacity: .9; }
  .pbody { padding: 10px 14px 14px; }
  dl.pk { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
  dl.pk dt { font-size: 11px; color: var(--muted); margin-top: 10px; }
  dl.pk dd { margin: 2px 0 0; font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  dl.pk.small { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 2px 10px; }
  dl.pk.small dt { margin-top: 4px; color: var(--ink); font-size: 12px; }
  dl.pk.small dd { margin-top: 4px; font-size: 12px; }
  .pbody details { border-top: 1px solid var(--line-soft); margin-top: 12px; padding-top: 8px; }
  .pbody summary { cursor: pointer; font-size: 12.5px; font-weight: 600; }
  ul.feat, ul.eps { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; }
  ul.feat li, ul.eps li { padding: 1px 0; }
  ul.eps small { display: block; color: var(--muted); font-size: 11px; }
  h2.tg { font: 400 26px/1.2 var(--serif); margin: 36px 0 0; }
  .tg-sub { margin: 2px 0 0; }
  .ilim { border-top: 1px solid var(--line-soft); padding-top: 4px; }
  details.fold { margin-top: 12px; }
  details.fold summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .viewbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: 0 0 20px; }
  .viewbar .tabs { border-bottom: 0; margin: 0; }
  .modesw { display: flex; align-items: center; gap: 6px; padding-bottom: 8px; }
  .modesw button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
  .modesw button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  details.sec { margin: 0 0 24px; border-top: 2px solid var(--line); padding-top: 10px; }
  details.sec > summary { cursor: pointer; font: 400 24px/1.3 var(--serif); }

function dsSnapshot(id) {
  const d = DS[id];
  const rates = Object.entries(d.rates).map(([k, r]) => {
    const u = usersOf(id, "rate", k);
    return [(u.scopes.join(" · ") || k) + (u.plans.length && u.plans.length < Object.keys(d.plans).length ? ` (${u.plans.join(", ")})` : ""), qtyStr(r.value, r.unit, r.period), r.l];
  });
  const quota = Object.entries(d.quotas).map(([k, q]) => {
    const u = usersOf(id, "quota", k);
    return [u.plans.join(", ") || k, qtyStr(q.value, q.unit, q.period) + (q.window ? ` · ${WIN[q.window]}` : " · reinicio no publicado"), q.l];
  });
  const overage = Object.entries(d.quotas).filter(([, q]) => q.over).map(([k, q]) => [usersOf(id, "quota", k).plans.join(", ") || k, dsOverage(q), q.overL]);
  return { date: d.date, kind: "tfm", ref: `03_datos/apis/${id}/datasheet.yaml`, integ: null, url: null, built: true, fromDS: true,
    rates, quota, overage: overage.length ? overage : null, acct: null };
}
const termsVersions = id => TERMS[id] ? TERMS[id].versions : [dsSnapshot(id)];

/* ---------- Árbol ---------- */
function renderTree() {
  const build = (list, level) => list.map(raw => {
    const n = nodeObj(raw);
    const isLeaf = n.leaf || n.pending;
    const sel = state.selected === n.id;
    if (isLeaf) {
      return `<li role="none"><button class="node leaf${n.pending ? " pending" : ""}" role="treeitem" aria-level="${level}"
        aria-selected="${sel}" data-id="${n.id}"><span class="chev"></span><span class="dot"></span>${esc(n.label)}
        ${n.leaf ? `<span class="count" title="Versiones de pricing · de otros términos">${APIS[n.id].versions.length} · ${termsVersions(n.id).length}</span>` : ""}</button></li>`;
    }
    const open = state.open.has(n.id);
    const total = leavesOf(n).filter(l => !l.pending).length;
    return `<li role="none"><button class="node" role="treeitem" aria-level="${level}" aria-expanded="${open}"
      aria-selected="${sel}" data-id="${n.id}"><span class="chev" aria-hidden="true">▶</span>${esc(n.label)}
      ${n.kind ? `<span class="kind">${n.kind}</span>` : ""}<span class="count">${total || leavesOf(n).length}</span></button>
      ${open ? `<ul role="group">${build(n.children, level + 1)}</ul>` : ""}</li>`;
  }).join("");
  document.getElementById("tree").innerHTML = build(TREE, 1);
}

document.getElementById("tree").addEventListener("click", e => {
  const b = e.target.closest(".node"); if (!b) return;
  const id = b.dataset.id;
  // Primer clic en un grupo: lo abre y lo selecciona. Clic sobre el ya seleccionado: lo pliega o despliega.
  if (b.hasAttribute("aria-expanded")) {
    if (state.selected !== id) state.open.add(id);
    else if (state.open.has(id)) state.open.delete(id);
    else state.open.add(id);
  }
  state.selected = id;
  render();
  document.querySelector(`.node[data-id="${id}"]`)?.focus();
});

function renderGroup(n) {
  const leaves = leavesOf(n);

    const a = APIS[l.id], v = a.versions, t = termsVersions(l.id);

    return `<button class="card" data-id="${l.id}"><div class="who"><span class="badge">TFM</span>${esc(a.owner)}</div>

}

/* ---------- Derivado: lo interpretado, lo calculado y lo inferido ----------
   La pestaña Pricing solo trae lo publicado y lo medido. Derivado es todo lo que no está tal cual
   en una fuente ni se midió: lo interpretado (el ámbar), lo calculado y lo inferido por agente.
   Va aquí, con su nota o su proceso, su versión y sus fuentes. */
/* Un valor es interpretado si la Datasheet lo lleva en ámbar (D1) o la heurística de PROV lo
   clasifica así (D18). Sale de Pricing y deja un enlace a Derivado. */
const isInterp = (api, key, l) => l === "a" || (provOf(api, key) || {}).t === "interpretado";
const interpLnk = api => `<a class="xl pv interpretado" href="#${svcNode(api).id}~pricing" data-go="${svcNode(api).id}" data-tab="pricing" data-scroll="derivado" title="Valor interpretado: no está tal cual en la fuente. Detalle en Derivado.">interpretado: ver Derivado</a>`;
function interpRows(api) {
  const d = DS[api], rows = [];
  const add = (key, what, plans, val, l) => {
    if (!isInterp(api, key, l)) return;
    const p = provOf(api, key);
    rows.push(`<tr><td>${esc(what)}</td><td>${esc(plans)}</td><td>${val} ${lt(l)}</td><td>${p && p.n ? provLinks(api, p) : `<span class="none">sin línea de procedencia</span>`}</td></tr>`);
  };
  for (const [pk, dp] of Object.entries(d.plans)) add("price:" + pk, "Precio", planName(pk), moneyOf(dp.price), dp.priceL);
  for (const [k, q] of Object.entries(d.quotas)) {
    const u = usersOf(api, "quota", k).plans.join(", ") || k;
    add("quota:" + k, "Cuota", u, qtyStr(q.value, q.unit, q.period), q.l);
    if (q.over) add("over:" + k, "Exceso", u, dsOverage(q), q.overL);
  }
  for (const [k, r] of Object.entries(d.rates)) {
    const u = usersOf(api, "rate", k);
    add("rate:" + k, "Rate", [u.plans.join(", "), u.scopes.join(" · ")].filter(Boolean).join(" · ") || k, qtyStr(r.value, r.unit, r.period), r.l);
  }
  return rows;
}

function timePos(vs) {
  const t = vs.map(v => +new Date(v.date));
  const min = Math.min(...t), max = Math.max(...t);
  return t.map(x => max === min ? 50 : ((x - min) / (max - min)) * 100);
}

function railHTML(rid, vs, idx, legend) {
  const pos = timePos(vs);
  // Se rotulan siempre la primera, la última y la consultada; las demás solo si no pisan a otra.
  const shown = new Set([0, vs.length - 1, idx]);
  pos.forEach((p, i) => { if (![...shown].some(j => Math.abs(pos[j] - p) < 20)) shown.add(i); });
  const stops = vs.map((v, i) => {
    const edge = pos[i] < 6 ? " edge-l" : pos[i] > 94 ? " edge-r" : "";
    return `<button class="stop ${v.cls}${i <= idx ? " past" : ""}" style="left:${pos[i]}%" data-i="${i}" tabindex="-1"
      aria-label="Ver la versión del ${fmtDate(v.date)}"></button>
      <span class="stop-label${edge}"${shown.has(i) ? "" : " hidden"} style="left:${pos[i]}%">${new Date(v.date + "T00:00:00").toLocaleDateString("es-ES", { month: "short", year: "numeric" })}</span>`;
  }).join("");
  return `<div class="rail" id="rail-${rid}">
      <div class="base"></div><div class="fill" style="width:${pos[idx]}%"></div>
      ${stops}
      <div class="marker" role="slider" tabindex="0" aria-label="Fecha consultada"
        aria-valuemin="0" aria-valuemax="${vs.length - 1}" aria-valuenow="${idx}" aria-valuetext="${fmtDate(vs[idx].date)}"
        style="left:${pos[idx]}%"><span class="tip">${fmtDate(vs[idx].date)}</span></div>
    </div>
    <div class="legend"><span><i></i>${legend[0]}</span><span><i class="ext"></i>${legend[1]}</span>
      <span>Arrastra el marcador o usa las flechas</span></div>`;
}

function bindRail(rid, vs, slot) {
  const rail = document.getElementById("rail-" + rid); if (!rail) return;
  const marker = rail.querySelector(".marker"), fill = rail.querySelector(".fill"), tip = rail.querySelector(".tip");
  const id = curApi(), pos = timePos(vs);
  const nearest = pct => pos.reduce((best, p, i) => Math.abs(p - pct) < Math.abs(pos[best] - pct) ? i : best, 0);
  const pctFrom = x => { const r = rail.getBoundingClientRect(); return Math.min(100, Math.max(0, ((x - r.left) / r.width) * 100)); };
  const commit = i => { state[slot][id] = i; render(); document.querySelector(`#rail-${rid} .marker`)?.focus({ preventScroll: true }); };
  // El arrastre escucha en la ventana: así el marcador se suelta bien aunque el puntero salga de la pista.
  let lastPct = null, justDragged = false;
  const move = e => {
    lastPct = pctFrom(e.clientX);
    marker.style.left = lastPct + "%"; fill.style.width = lastPct + "%";
    tip.textContent = fmtDate(vs[nearest(lastPct)].date);
  };
  const end = e => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", end);
    marker.classList.remove("dragging");
    if (lastPct === null) return;
    const i = nearest(pctFrom(e.clientX ?? 0) ?? lastPct);
    justDragged = true; setTimeout(() => { justDragged = false; }, 0);
    marker.classList.add("animate"); marker.style.left = pos[i] + "%"; fill.style.width = pos[i] + "%";
    setTimeout(() => commit(i), matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 220);
  };
  marker.addEventListener("pointerdown", e => {
    e.preventDefault(); lastPct = null;
    marker.classList.add("dragging"); marker.classList.remove("animate");
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", end);
  });
  rail.addEventListener("click", e => {
    if (justDragged || e.target === marker || marker.contains(e.target)) return;
    const stop = e.target.closest(".stop");
    commit(stop ? +stop.dataset.i : nearest(pctFrom(e.clientX)));
  });
  marker.addEventListener("keydown", e => {
    const cur = state[slot][id] ?? vs.length - 1;
    const next = { ArrowLeft: cur - 1, ArrowDown: cur - 1, ArrowRight: cur + 1, ArrowUp: cur + 1, Home: 0, End: vs.length - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    commit(Math.max(0, Math.min(vs.length - 1, next)));
  });
}

}

/* ---------- Versión 2 (2026-10-23): árbol de proveedores, servicios e interfaces ----------
   Sugerencia del tutor: a la izquierda, proveedores, servicios e interfaces, al modo de iCan.
   Proveedores y servicios salen de provider-service-resolver; interfaces y canal, de
   saas-interface-channel-analyzer (skills de Daniel Ruiz, piloto_skills_druiz/).
   Tipo, propósito y modelo de pricing de cada interfaz son una propuesta del TFM derivada
   del canal; los términos de consumo salen de la Datasheet de la API.
   Cada servicio cuelga dos hermanos, Pricing e Interfaces; Pricing y Otros términos
   son pestañas del servicio. Los ids de nodo son p:, s:, pr:, in: e i:. La ruta del
   navegador es #id~pestaña, y checkLinks() recorre todos los nodos y comprueba los enlaces. */
const SVC_CLS = { autonomous_service: "Autónomo", dependent_service: "Dependiente" };
const PURPOSE_HELP = {
  "Consumo": "Se usa el servicio a través de ella: enviar o consultar.",
  "Administrativa": "Se configura el servicio a través de ella: claves, dominios, plantillas.",
  "Integración": "El servicio empuja hacia ti: eventos, correo recibido. El propósito indica la dirección; el coste va aparte.",
  "Consumo y administración": "Sirve para usar el servicio y para configurarlo desde terminal o agente.",
};
const PEND_WHY = { unresolved_candidate: "falta que el resolver decida el servicio", requirement_unknown: "falta el requisito de plan" };
const isApi = t => t === "API REST" || t === "SMTP";

const TREE2 = ICAN.map(p => ({ id: "p:" + p.id, label: p.provider, kind: "proveedor", prov: p,
  children: p.services.map((s, si) => ({ id: `s:${p.id}:${si}`, label: s.name, kind: "servicio", svc: s, prov: p, si,
    pending: !s.interfaces.length,
    children: !s.interfaces.length ? [] : [
      { id: `pr:${p.id}:${si}`, label: "Pricing", leaf: true, node: "pricing", svc: s, prov: p, si },
      { id: `in:${p.id}:${si}`, label: "Interfaces", kind: "grupo", node: "interfaces", svc: s, prov: p, si,
        children: s.interfaces.map((f, fi) => ({ id: `i:${p.id}:${si}:${fi}`, label: f.name, leaf: true, iface: f, svc: s, prov: p, si, fi })) },
    ] })) }));

function findPath2(id, list = TREE2, path = []) {
  for (const n of list) {
    if (n.id === id) return [...path, n];
    if (n.children) { const r = findPath2(id, n.children, [...path, n]); if (r) return r; }
  }
  return null;
}
const nodeOf = id => { const p = findPath2(id); return p ? p[p.length - 1] : null; };
const curNode = () => nodeOf(state.selected);
const curApi = () => { const n = curNode(); return n && n.svc ? n.svc.api : null; };
const SVC_OF = {};
TREE2.forEach(p => p.children.forEach(s => { if (s.svc.api) SVC_OF[s.svc.api] = s; }));
const allNodes = (list = TREE2, out = []) => { list.forEach(n => { out.push(n); if (n.children) allNodes(n.children, out); }); return out; };
state.selected = "s:postmark:0";
state.open = new Set(["p:postmark", "s:postmark:0", "in:postmark:0"]);

/* ---------- Enlaces entre páginas ----------
   Un enlace interno lleva href="#id~pestaña" y data-go; un único manejador lo resuelve con go(). */
const lnk = (id, text, tab, title, scroll) => `<a class="xl" href="#${id}${tab ? "~" + tab : ""}" data-go="${id}"${tab ? ` data-tab="${tab}"` : ""}${scroll ? ` data-scroll="${scroll}"` : ""}${title ? ` title="${esc(title)}"` : ""}>${text}</a>`;
/* Enlace a un bloque de la misma página: no cambia la ruta, solo desplaza */
const scrollLnk = (target, text) => `<a class="xl" href="#${target}" data-scroll="${target}">${text}</a>`;
const extLnk = (url, text) => `<a class="xl ext" href="${esc(url)}" target="_blank" rel="noopener">${text == null ? esc(url) : text}</a>`;
const fileLnk = (rel, text) => `<a class="xl file" href="https://github.com/danvelcam/tfm-pricing-apis-correo/blob/main/${esc(rel)}">${text == null ? `<code>${esc(rel)}</code>` : text}</a>`;
const svcNode = api => SVC_OF[api];
const toSvc = (api, text, tab) => { const s = svcNode(api); return lnk(s.id, text, tab); };
const toPricing = (api, text) => { const s = svcNode(api); return lnk(`pr:${s.prov.id}:${s.si}`, text, "pricing"); };

let navPush = false;
const hashOf = () => {
  const n = curNode();
  if (!n) return "#all";
  const tab = n.svc && n.svc.api && (n.node === "pricing" || n.kind === "servicio") ? "~" + (state.tab[n.svc.api] || "pricing") : "";
  return "#" + n.id + tab;
};
function syncHash() {
  try {
    const h = hashOf();
    if (location.hash !== h) history[navPush ? "pushState" : "replaceState"](null, "", h);
  } catch (e) { /* sin historial: la página sigue funcionando */ }
  navPush = false;
}
function go(id, tab) {
  if (id === "all") { state.selected = "all"; render(); return true; }
  const path = findPath2(id);
  if (!path) return false;
  path.slice(0, -1).forEach(x => state.open.add(x.id));
  const n = path[path.length - 1];
  if (n.children && n.children.length) state.open.add(n.id);
  if (tab && n.svc && n.svc.api) {
    if (tab === "terms" && n.node === "pricing") return go(`s:${n.prov.id}:${n.si}`, "terms");
    if (tab === "pricing" || tab === "terms") state.tab[n.svc.api] = tab;
  }
  state.selected = id;
  render();
  return true;
}
function setTab(t) {
  const n = curNode();
  if (!n || !n.svc || !n.svc.api) return;
  if (n.node === "pricing" && t === "terms") go(`s:${n.prov.id}:${n.si}`, "terms");
  else { state.tab[n.svc.api] = t; render(); }
  document.querySelector(`[role=tab][data-tab="${t}"]`)?.focus();
}
const fromHash = () => {
  let h = ""; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { return false; }
  if (!h) return false;
  const [id, tab] = h.split("~");
  return go(id, tab);
};
document.addEventListener("click", e => {
  const m = e.target.closest("[data-mode]");
  if (m) { state.mode = m.dataset.mode === "compact" ? "compact" : "tabs"; render(); return; }
  const a = e.target.closest("a[data-go], a[data-scroll]"); if (!a) return;
  e.preventDefault();
  if (a.dataset.go) { navPush = true; go(a.dataset.go, a.dataset.tab); }
  const target = (a.dataset.scroll && document.getElementById(a.dataset.scroll))
    || (state.mode === "compact" && a.dataset.tab && document.getElementById("sec-" + a.dataset.tab));
  (target || document.getElementById("view")).scrollIntoView?.({ block: "start" });
});
window.addEventListener("hashchange", () => { if (location.hash !== hashOf()) fromHash(); });

renderTree = function () {
  const build = (list, level) => list.map(n => {
    const sel = state.selected === n.id;
    if (n.leaf || !n.children.length) {
      const tag = n.iface ? `<span class="count" title="Tipo de interfaz">${esc(n.iface.type)}</span>`
        : n.node === "pricing" ? `<span class="count" title="Planes vigentes">${APIS[n.svc.api].versions.slice(-1)[0].plans.length} planes</span>`
        : `<span class="count" title="Interfaces sin analizar">—</span>`;
      return `<li role="none"><button class="node leaf${n.leaf ? "" : " pending"}" role="treeitem" aria-level="${level}"
        aria-selected="${sel}" data-id="${n.id}"><span class="chev"></span><span class="dot"></span>${esc(n.label)}${tag}</button></li>`;
    }
    const open = state.open.has(n.id);
    const cnt = n.kind === "servicio" && n.svc.pend ? `${n.svc.interfaces.length}/${n.svc.interfaces.length + n.svc.pend.length}` : n.kind === "servicio" ? n.svc.interfaces.length : n.children.length;
    const cntTitle = n.kind === "servicio" && n.svc.pend ? pendLabel(n.svc) : n.kind === "servicio" ? "Interfaces del servicio" : n.kind === "grupo" ? "Interfaces" : "";
    return `<li role="none"><button class="node" role="treeitem" aria-level="${level}" aria-expanded="${open}"
      aria-selected="${sel}" data-id="${n.id}"><span class="chev" aria-hidden="true">▶</span>${esc(n.label)}
      <span class="count"${cntTitle ? ` title="${cntTitle}"` : ""}>${cnt}</span></button>
      ${open ? `<ul role="group">${build(n.children, level + 1)}</ul>` : ""}</li>`;
  }).join("");
  document.getElementById("tree").innerHTML = build(TREE2, 1);
};

renderCrumbs = function () {
  const path = findPath2(state.selected) || [];
  const parts = [`<button data-id="all">Colecciones</button>`].concat(path.map((n, i) =>
    i === path.length - 1 ? `<span aria-current="page">${esc(n.label)}</span>` : `<button data-id="${n.id}">${esc(n.label)}</button>`));
  document.getElementById("crumbs").innerHTML = parts.join("<span aria-hidden='true'>/</span>");
};

function ifaceCards(s, p, si) {
  return `<div class="grid">${s.interfaces.map((f, fi) => `<button class="card" data-id="i:${p.id}:${si}:${fi}">
    <div class="who"><span class="badge">${esc(f.channel.slice(0, 3).toUpperCase())}</span>${esc(f.channel)}</div>
    <h3>${esc(f.name)}</h3><div class="meta"><span>${esc(f.type)}</span><span>${esc(f.purpose)}</span>${f.marketing ? `<span>Fuera de alcance (marketing)</span>` : ""}${f.reclass ? `<span>Reclasificada</span>` : ""}</div></button>`).join("")}</div>`;
}

function renderAll() {
  const cards = ICAN.map(p => `<button class="card" data-id="p:${p.id}"><div class="who"><span class="badge">TFM</span>Proveedor</div>
    <h3>${esc(p.provider)}</h3><div class="meta"><span>${p.services.length} ${p.services.length === 1 ? "servicio" : "servicios"}</span>
    <span>${p.services.reduce((a, s) => a + s.interfaces.length, 0)} interfaces</span></div></button>`).join("");
  const nif = ICAN.reduce((a, p) => a + p.services.reduce((b, s) => b + s.interfaces.length, 0), 0);
  return `<h1>APIs de correo</h1><p class="sub">${ICAN.length} proveedores, ${ICAN.reduce((a, p) => a + p.services.length, 0)} servicios y ${nif} interfaces. Elige un proveedor.</p><div class="grid">${cards}</div>`;
}

function renderProvider(n) {
  const p = n.prov;
  const cards = p.services.map((s, si) => `<button class="card${s.interfaces.length ? "" : " pending"}" data-id="s:${p.id}:${si}">
    <div class="who"><span class="badge">${s.interfaces.length ? "TFM" : "—"}</span>Servicio ${esc((SVC_CLS[s.cls] || s.cls).toLowerCase())}${s.doubt ? " · en duda" : ""}</div>
    <h3>${esc(s.name)}</h3><div class="meta">${s.interfaces.length ? `<span>${s.interfaces.length} interfaces</span><span>Con Datasheet</span>` : "<span>Fuera del alcance del TFM</span>"}</div></button>`).join("");
  return `<h1>${esc(p.provider)}</h1><p class="sub">Proveedor. Servicios según provider-service-resolver; el TFM tiene la Datasheet del servicio de correo transaccional.</p><div class="grid">${cards}</div>`;
}

function pendHTML(s) {
  if (!s.pend) return "";
  return `<div id="pend"><p class="h4">${pendLabel(s)}</p>
    <details class="fold"><summary>Ver las ${s.pend.length} pendientes y su motivo</summary>
    <table class="kv wide"><thead><tr><th scope="col">Interfaz</th><th scope="col">Motivo</th></tr></thead><tbody>${s.pend.map(x => `<tr><th scope="row">${esc(x.name)}</th><td>${esc(PEND_WHY[x.reason] || x.reason)} <small>${esc(x.reason)}</small></td></tr>`).join("")}</tbody></table>
    <p class="small none">Fuente: ${fileLnk(AN.ses.file, "analyzer.yaml")}, sección pending.</p></details></div>`;
}
const pendLabel = s => `${s.interfaces.length} confirmadas de ${s.interfaces.length + s.pend.length} · ${s.pend.length} pendientes de resolver`;
function interfacesBlock(n) {
  const s = n.svc, p = n.prov;
  return `<div class="block" id="interfaces"><h3>Interfaces del servicio</h3>
    <p class="sub">${s.interfaces.length} interfaces según saas-interface-channel-analyzer. Elige una para ver sus propiedades.</p>${ifaceCards(s, p, n.si)}${pendHTML(s)}</div>`;
}
function renderInterfaces(n) {
  const s = n.svc, p = n.prov;
  return `<div class="title-row"><div><h1>Interfaces de ${esc(s.name)}</h1>
    <p class="sub">${esc(p.provider)} · ${lnk(`s:${p.id}:${n.si}`, "volver al servicio")} · ${toPricing(s.api, "pricing del servicio")}</p></div></div>${interfacesBlock(n)}`;
}

function renderService(n) {
  const s = n.svc, p = n.prov;
  if (!s.interfaces.length) return `<h1>${esc(s.name)}</h1><p class="sub">Servicio ${esc((SVC_CLS[s.cls] || s.cls).toLowerCase())} de ${esc(p.provider)}${s.doubt ? ", con la clasificación en duda" : ""}. El resolver lo identifica, pero sus interfaces no se han analizado: queda fuera del alcance del TFM.</p>`;
  const api = s.api, tab = state.tab[api] || "pricing";
  if (state.mode === "compact") {
    const sec = (key, title, body) => `<details class="sec" id="sec-${key}" open><summary>${title}</summary>${body}</details>`;
    return `${serviceHead(api)}${tabsBar(api, tab)}
      ${sec("pricing", "Pricing", renderPricing(api))}
      ${sec("terms", "Otros términos", renderTerms(api))}
      ${sec("interfaces", "Interfaces", interfacesBlock(svcNode(api)))}
      ${sec("derivado", "Derivado", derivadoHTML(api))}`;
  }
  return `${serviceHead(api)}${tabsBar(api, tab)}
    <div id="panel" role="tabpanel" aria-labelledby="tab-${tab}">${tab === "pricing" ? renderPricing(api) : renderTerms(api)}</div>
    ${n.node === "pricing" ? "" : interfacesBlock(n)}
    ${derivadoHTML(api)}`;
}

function kvRows(rows) {
  return rows.map(([k, v, l]) => `<tr><th>${esc(k)}</th><td>${v}${l ? lt(l) : ""}</td></tr>`).join("");
}

function renderIface(n) {
  const f = n.iface, s = n.svc, p = n.prov;
  const props = [
    ["Tipo de interfaz", `${esc(f.type)} ${infChip(s.api)}${f.reclass ? `<small><span class="pv none">reclasificada</span> ${esc(f.reclass.charAt(0).toUpperCase() + f.reclass.slice(1))}</small>` : ""}`],
    ["Propósito", `<b>${esc(f.purpose)}</b> ${infChip(s.api)}<small>${esc(PURPOSE_HELP[f.purpose] || "")}</small>`],
    ["Modelo de pricing", `${esc(f.pricing)} ${infChip(s.api)}<small>${toPricing(s.api, "Ver el pricing del servicio")}</small>`],
    ...(f.marketing ? [["Alcance", `<span class="pv none">fuera de alcance (marketing)</span><small>Es la aplicación de marketing del proveedor, no la del correo transaccional.</small>`]] : []),
    ["Canal (Daniel Ruiz)", esc(f.channel)],
    ["Tecnología", esc(f.tech)],
    ["Servicio", `${toSvc(s.api, esc(s.name))} · ${esc(p.provider)}`],
  ];
  let terms = "";
  if (isApi(f.type)) {
    const snap = dsSnapshot(s.api);
    const own = (IFACE_LIMITS[s.api] || []).filter(o => o.type === f.type);
    terms = `<div class="block"><h3>Términos de consumo</h3>
      <p class="sub">Vista parcial de la Datasheet del servicio. De la Datasheet ACM2YAML de ${esc(APIS[s.api].name)} (${fmtDate(snap.date)}).</p>
      <p class="sub">${toSvc(s.api, "Ir al servicio", "terms")} · ${toPricing(s.api, "Ir al pricing")} · ${fileLnk(`03_datos/apis/${s.api}/datasheet.yaml`, "Datasheet (YAML)")}</p>
      <p class="h4">Propios de esta interfaz</p>
      ${own.length ? own.map(o => `<table class="kv"><tbody><tr><th>${esc(o.name)}</th><td>${esc(o.value)}<small>${esc(o.note)}</small></td></tr></tbody></table>`).join("") : `<p class="none small">No tiene límites propios anotados.</p>`}
      <p class="h4">Compartidos con el resto del servicio</p>
      <p class="small none">Valen para todas las interfaces que consumen la cuota del plan. ${toSvc(s.api, "Cómo se reparten", "terms")}.</p>
      <div class="cols"><div><p class="h4">Rates</p><table class="kv"><tbody>${kvRows(snap.rates) || "<tr><td class='none'>No publicados</td></tr>"}</tbody></table></div>
      <div><p class="h4">Cuotas</p><table class="kv"><tbody>${kvRows(snap.quota) || "<tr><td class='none'>No publicadas</td></tr>"}</tbody></table>
      ${snap.overage ? `<p class="h4">Exceso</p><table class="kv"><tbody>${kvRows(snap.overage)}</tbody></table>` : ""}</div></div></div>`;
  }
  const notice = f.type === "Web UI"
    ? `<div class="notice" role="note"><p class="small">Propuesta del TFM. No consta que el envío desde el panel gaste la cuota.${f.name === "AWS Management Console" ? ` La consola envía correos de prueba; no consta si gastan cuota (panel, 2026-09-18).` : ""}</p></div>` : "";
  return `<div class="title-row"><div><h1>${esc(f.name)}${f.marketing ? ` <span class="pv none">fuera de alcance (marketing)</span>` : ""}</h1><p class="sub">Interfaz de ${toSvc(s.api, esc(s.name))} · ${esc(p.provider)}</p></div></div>
    <div class="stats"><div class="stat"><span>Tipo</span><strong>${esc(f.type)}</strong></div>
      <div class="stat"><span>Propósito</span><strong>${esc(f.purpose)}</strong></div>
      <div class="stat"><span>Canal</span><strong>${esc(f.channel)}</strong></div>
      <div class="stat"><span>Términos de consumo</span><strong>${isApi(f.type) ? "Sí" : "No aplica"}</strong></div></div>
    <div class="block" style="margin-top:0"><h3>Propiedades</h3><table class="kv"><tbody>${kvRows(props)}</tbody></table></div>${notice}${terms}`;
}

function bindRails(api) {
  const tab = state.tab[api] || "pricing";
  if (state.mode === "compact" || tab === "pricing") bindRail("p", APIS[api].versions, "version");
  if (state.mode === "compact" || tab === "terms") bindRail("t", termsVersions(api), "tversion");
}

render = function () {
  renderTree(); renderCrumbs();
  const view = document.getElementById("view");
  const n = curNode();
  if (n && n.node === "pricing") state.tab[n.svc.api] = "pricing";
  if (!n) view.innerHTML = renderAll();
  else if (n.iface) view.innerHTML = renderIface(n);
  else if (n.kind === "proveedor") view.innerHTML = renderProvider(n);
  else if (n.node === "interfaces") view.innerHTML = renderInterfaces(n);
  else {
    view.innerHTML = renderService(n);
    if (n.svc.api && n.svc.interfaces.length) bindRails(n.svc.api);
  }
  syncHash();
};

/* ---------- Comprobación de enlaces ----------
   Recorre todos los nodos, y en cada servicio las dos pestañas, y comprueba que cada enlace
   interno llega a un nodo y a una pestaña que existen, que los externos son URLs bien formadas
   y que la trazabilidad se cierra: servicio → cada interfaz, interfaz → servicio y pricing.
   Uso desde la consola: checkLinks(). Devuelve el recuento y las listas broken y missing. */
function checkLinks() {
  const keep = { sel: state.selected, tab: Object.assign({}, state.tab), mode: state.mode };
  const res = { nodes: 0, pages: 0, links: 0, internal: 0, external: 0, files: [], broken: [], missing: [] };
  const TABS = ["pricing", "terms"];
  const fileSet = new Set(), extSet = new Set();
  const collect = () => {
    const out = [];
    document.querySelectorAll("#view a[data-scroll]:not([data-go])").forEach(a => {
      if (!document.getElementById(a.dataset.scroll)) res.broken.push(`${state.selected}: ancla #${a.dataset.scroll} sin destino`);
    });
    document.querySelectorAll("#view [data-go], #view a[href^='#']:not([data-scroll])").forEach(a => {
      const href = a.getAttribute("href") || "", [hid, htab] = decodeURIComponent(href.slice(1)).split("~");
      out.push({ id: a.dataset.go || hid, tab: a.dataset.tab || htab, href, dataGo: a.dataset.go });
    });
    document.querySelectorAll("#view button.card[data-id]").forEach(b => out.push({ id: b.dataset.id, card: true }));
    document.querySelectorAll("#crumbs button[data-id], #tree .node[data-id]").forEach(b => out.push({ id: b.dataset.id, nav: true }));
    return out;
  };
  const visit = (n, tab) => {
    if (n.svc && n.svc.api && tab) state.tab[n.svc.api] = tab;
    state.selected = n.id; render();
    res.pages++;
    const here = n.id + (tab ? "~" + tab : "");
    const ls = collect();
    ls.forEach(l => {
      res.links++;
      if (l.id !== "all" && !findPath2(l.id)) res.broken.push(`${here} → ${l.id} (no existe)`);
      else if (l.tab && !TABS.includes(l.tab)) res.broken.push(`${here} → ${l.id}~${l.tab} (pestaña inexistente)`);
      else if (l.href !== undefined && l.dataGo && l.href !== "#" + l.dataGo + (l.tab ? "~" + l.tab : "")) res.broken.push(`${here}: href ${l.href} no coincide con data-go ${l.dataGo}`);
      else res.internal++;
    });
    document.querySelectorAll("#view a[href]:not([href^='#'])").forEach(a => {
      const h = a.getAttribute("href");
      if (/^https?:/.test(h)) { try { new URL(h); res.external++; extSet.add(h); } catch (e) { res.broken.push(`${here}: URL mal formada ${h}`); } }
      else { res.external++; fileSet.add(h); }
    });
    return new Set(ls.map(l => l.id));
  };
  allNodes().forEach(n => {
    res.nodes++;
    if (n.svc && n.svc.api && (n.kind === "servicio" || n.node === "pricing")) {
      const seen = new Set();
      TABS.forEach(t => {
        if (n.node === "pricing" && t === "terms") return;
        visit(n, t).forEach(x => seen.add(x));
        if (!document.getElementById("derivado")) res.broken.push(`${n.id}~${t}: falta el bloque Derivado`);
      });
      /* presentación compacta (f4): las tres secciones y sus dos líneas de tiempo */
      const mode0 = state.mode; state.mode = "compact";
      visit(n, "pricing").forEach(x => seen.add(x));
      ["sec-pricing", "sec-terms", "sec-interfaces"].concat(APIS[n.svc.api].versions.length > 1 ? ["rail-p"] : [], termsVersions(n.svc.api).length > 1 ? ["rail-t"] : []).forEach(i => { if (!document.getElementById(i)) res.broken.push(`${n.id} compacta: falta #${i}`); });
      state.mode = mode0;
      if (n.kind === "servicio") {
        n.children[1].children.forEach(c => { if (!seen.has(c.id)) res.missing.push(`${n.id} no enlaza a ${c.id}`); });
      }
    } else {
      const seen = visit(n);
      if (n.iface) {
        if (!seen.has(`s:${n.prov.id}:${n.si}`)) res.missing.push(`${n.id} no enlaza a su servicio`);
        if (!seen.has(`pr:${n.prov.id}:${n.si}`)) res.missing.push(`${n.id} no enlaza a su pricing`);
      }
    }
  });
  res.files = [...fileSet].sort(); res.externalUrls = extSet.size;
  state.selected = keep.sel; state.tab = keep.tab; state.mode = keep.mode; render();
  return res;
}

if (!fromHash()) render();
</script>
